<!doctype html>
<!-- The light aura ground (Aura v65 ekran.css → .aura .a1–.a5 on --canvas), drawn at the canvas's
     390 × 844 by scripts/aura/ground.ts into apps/mobile/assets/aura/ground-light.webp. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 390px;
        height: 844px;
        overflow: hidden;
        background: #eff7f1;
      }
      .aura {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .aura i {
        position: absolute;
        border-radius: 50%;
        filter: blur(64px);
      }
      .a1 {
        width: 360px;
        height: 300px;
        left: -110px;
        top: -70px;
        background: rgba(18, 152, 79, 0.34);
      }
      .a2 {
        width: 300px;
        height: 280px;
        right: -120px;
        top: 30px;
        background: rgba(255, 79, 139, 0.26);
      }
      .a3 {
        width: 280px;
        height: 210px;
        left: 80px;
        top: 220px;
        background: rgba(255, 181, 71, 0.24);
      }
      .a4 {
        width: 420px;
        height: 320px;
        left: -60px;
        bottom: -150px;
        background: rgba(18, 152, 79, 0.18);
      }
      .a5 {
        width: 260px;
        height: 260px;
        right: -90px;
        bottom: 120px;
        background: rgba(255, 79, 139, 0.14);
      }
    </style>
  </head>
  <body>
    <div class="aura">
      <i class="a1"></i><i class="a2"></i><i class="a3"></i><i class="a4"></i><i class="a5"></i>
    </div>
  </body>
</html>
