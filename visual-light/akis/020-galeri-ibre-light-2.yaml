appId: app.kabuk.mobile
name: galeri-ibre-light-2
---
- openLink: "masa:///gorsel?durum=galeri/ibre&tema=light&sayfa=1&sayfalar=3&n=20"
- extendedWaitUntil:
    notVisible:
      id: launch-curtain
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: gorsel-hazir-20
    timeout: 20000
    optional: true
- runFlow:
    when:
      notVisible:
        id: gorsel-hazir-20
    commands:
      - stopApp
      - openLink: "masa:///gorsel?durum=galeri/ibre&tema=light&sayfa=1&sayfalar=3&n=20"
      - extendedWaitUntil:
          notVisible:
            id: launch-curtain
          timeout: 60000
      - extendedWaitUntil:
          visible:
            id: gorsel-hazir-20
          timeout: 60000
- assertNotVisible:
    id: gorsel-yok
- assertNotVisible:
    id: gorsel-eksik-sayfa
- runFlow:
    when:
      visible:
        id: android:id/aerr_wait
    commands:
      - tapOn:
          id: android:id/aerr_wait
- takeScreenshot:
    path: aday__galeri-ibre-light-2
    cropOn:
      id: gorsel-cerceve
