appId: app.kabuk.mobile
name: galeri-sahtekar-light-7
---
- openLink: "masa:///gorsel?durum=galeri/sahtekar&tema=light&sayfa=6&sayfalar=10&n=12"
- extendedWaitUntil:
    notVisible:
      id: launch-curtain
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: gorsel-hazir-12
    timeout: 20000
    optional: true
- runFlow:
    when:
      notVisible:
        id: gorsel-hazir-12
    commands:
      - stopApp
      - openLink: "masa:///gorsel?durum=galeri/sahtekar&tema=light&sayfa=6&sayfalar=10&n=12"
      - extendedWaitUntil:
          notVisible:
            id: launch-curtain
          timeout: 60000
      - extendedWaitUntil:
          visible:
            id: gorsel-hazir-12
          timeout: 60000
- assertNotVisible:
    id: gorsel-yok
- assertNotVisible:
    id: gorsel-eksik-sayfa
- runFlow:
    when:
      visible:
        id: android:id/aerr_wait
    commands:
      - tapOn:
          id: android:id/aerr_wait
- takeScreenshot:
    path: aday__galeri-sahtekar-light-7
    cropOn:
      id: gorsel-cerceve
