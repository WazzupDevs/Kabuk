appId: app.kabuk.mobile
name: galeri-kimlik-light-2
---
- openLink: "masa:///gorsel?durum=galeri/identity&tema=light&sayfa=1&sayfalar=2&n=8"
- extendedWaitUntil:
    notVisible:
      id: launch-curtain
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: gorsel-hazir-8
    timeout: 20000
    optional: true
- runFlow:
    when:
      notVisible:
        id: gorsel-hazir-8
    commands:
      - stopApp
      - openLink: "masa:///gorsel?durum=galeri/identity&tema=light&sayfa=1&sayfalar=2&n=8"
      - extendedWaitUntil:
          notVisible:
            id: launch-curtain
          timeout: 60000
      - extendedWaitUntil:
          visible:
            id: gorsel-hazir-8
          timeout: 60000
- assertNotVisible:
    id: gorsel-yok
- assertNotVisible:
    id: gorsel-eksik-sayfa
- runFlow:
    when:
      visible:
        id: android:id/aerr_wait
    commands:
      - tapOn:
          id: android:id/aerr_wait
- takeScreenshot:
    path: aday__galeri-kimlik-light-2
    cropOn:
      id: gorsel-cerceve
- assertScreenshot:
    path: /home/runner/work/Kabuk/Kabuk/e2e/visual/baz/galeri-kimlik-light-2.png
