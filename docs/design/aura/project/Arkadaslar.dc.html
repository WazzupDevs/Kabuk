body{margin:0}

.dark.pA{--overlap:#FFFFFF}
.top{display:flex;align-items:center;justify-content:space-between;height:56px;flex:none}
.pg{padding-top:52px;gap:0}
.sub{margin-top:2px}
.lst{padding:4px 0;display:flex;flex-direction:column}
.lr{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:64px;position:relative;color:var(--text)}
.lr+.lr:before{content:"";position:absolute;top:0;left:72px;right:16px;border-top:1px solid var(--hair)}
.lr.ic+.lr.ic:before{left:52px}
.lr>.ci{color:var(--muted)}
.lr.danger,.lr.danger .h3,.lr.danger>.ci{color:var(--danger)}
.cv{color:var(--muted);display:flex}
.note{font:500 13px/18px var(--font);color:var(--muted)}
.sh{padding:12px 20px 38px;background:var(--canvas);gap:16px;box-shadow:var(--shadow-sheet);z-index:3}
.sh .title{margin-top:4px}
.ban{border-radius:22px;padding:14px 16px;background:var(--warn-soft);color:var(--on-warn-soft);display:flex;flex-direction:column;gap:4px}
.ban p{color:var(--on-warn-soft)}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow-raised)}
.ghost{background:none;border:0;box-shadow:none;color:var(--text)}
.btn.danger .ci{--ci-a:var(--on-danger-soft);--ci-b:var(--on-danger-soft)}
.btn.primary .ci{--ci-a:var(--on-primary);--ci-b:var(--on-primary)}
.box{width:24px;height:24px;border-radius:8px;box-shadow:inset 0 0 0 2px var(--border);flex:none;display:flex;align-items:center;justify-content:center}
.box.on{background:var(--primary);box-shadow:none;color:var(--on-primary);--ci-a:var(--on-primary);--ci-b:var(--on-primary);--ci-bo:1}
.radio{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--border);flex:none}
.radio.on{box-shadow:inset 0 0 0 7px var(--primary)}
.opt{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 16px;border-radius:22px;background:var(--soft-bg);border:1px solid var(--soft-line);box-shadow:var(--soft-shadow)}
.opt.on{box-shadow:0 0 0 2px var(--primary)}
.capav{border-radius:50%;overflow:hidden;flex:none;display:block}
.capav svg{display:block;width:100%;height:100%}
.dark.pA .sh{background:#121614;box-shadow:none}
.dark.pA .btn.soft,.dark.pA .chip{border-color:rgba(255,255,255,.10)}
.dark.pA .btn.primary{box-shadow:none}
.dark.pA .btn.off{background:#1F2623;color:#A3AEA8}
.dark.pA .av{border-color:#121614}
.dark.pA .card{background:#1B211F;box-shadow:none}
.dark.pA .ban{background:#3A2A10;color:#FFE2B3}.dark.pA .ban p{color:#FFE2B3}
.dark.pA .opt.on{box-shadow:0 0 0 2px #3DDC84}.dark.pA .radio.on{box-shadow:inset 0 0 0 7px #3DDC84}
.dark.pA .box.on{background:#3DDC84;--ci-a:#0B0E0D;--ci-b:#0B0E0D}
.dark.pA .lr.danger,.dark.pA .lr.danger .h3,.dark.pA .lr.danger>.ci{color:#FF977E}


.round.soft .ci{--ci-a:var(--accent)}
.dark.pA .round.soft .ci{--ci-a:#3DDC84}
.fade{position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(transparent,var(--canvas) 70%);pointer-events:none}

</style>
