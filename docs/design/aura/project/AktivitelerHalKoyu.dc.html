body{margin:0}

.dark.pA{--overlap:#FFFFFF}





.glassseg{background:var(--glass-bg);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow)}
.dark .seg span.on{background:rgba(255,255,255,.94);color:#0B0E0D}
.vi{width:52px;height:52px;border-radius:16px;flex:none;box-shadow:var(--shadow-raised)}
.dark.pA .tag.ok{background:rgba(61,220,132,.16);color:#93EBB9}.dark.pA .tag.lively{background:rgba(255,181,71,.16);color:#FFD8A3}
.fadebot{position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(transparent,var(--canvas) 70%);pointer-events:none}


.ev{padding:8px;border-radius:30px;flex:none}
.evs{position:relative;aspect-ratio:334/168;border-radius:22px;overflow:hidden}
.evs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.evt{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:6px;align-items:flex-start}
.evt .tag:last-child{margin-left:auto}
.tag.gl{background:rgba(255,255,255,.86);color:#031B0B}
.tag.lively.gl,.dark.pA .tag.lively.gl{background:#FFE7C2;color:#7A4300}
.dark.pA .tag.gl{background:rgba(255,255,255,.86);color:#031B0B}
.evb{display:flex;flex-direction:column;gap:2px;padding:12px 10px 8px}
.evb .ven{color:var(--primary);font-weight:600}
.dark.pA .evb .ven{color:#3DDC84}
.content>*{flex-shrink:0}

.erc{width:64px;height:64px;border-radius:32px;display:flex;align-items:center;justify-content:center;background:var(--soft-bg);border:1px solid var(--soft-line);color:var(--muted)}
.erc .ci{width:28px;height:28px}
.dark.pA .erc{background:#121614;border-color:rgba(255,255,255,.10)}
.dark.pA .btn.soft{border-color:rgba(255,255,255,.10)}
