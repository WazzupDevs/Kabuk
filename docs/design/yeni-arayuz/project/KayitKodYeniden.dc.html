@keyframes drop{0%{transform:translateY(120px);opacity:0}55%{transform:translateY(-14px);opacity:1}75%{transform:translateY(5px)}100%{transform:translateY(0);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(var(--r,1.5deg))}}
@keyframes swing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes tw{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1.15);opacity:1}}
@keyframes up{0%{transform:translateY(16px);opacity:0}100%{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes slide{0%{transform:translateY(40px);opacity:0}100%{transform:none;opacity:1}}
.stage .bgl{animation:up .6s ease-out both}
.stage .lmp{transform-origin:70px 0;animation:swing 3.2s ease-in-out .4s infinite}
.stage .msa{animation:slide .55s cubic-bezier(.2,.8,.2,1) .15s both}
.stage .ent{animation:drop .7s cubic-bezier(.3,.7,.3,1) both}
