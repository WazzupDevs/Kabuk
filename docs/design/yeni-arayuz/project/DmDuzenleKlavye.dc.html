<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>DM: düzenlerken klavye açık</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="skall.css">
<link rel="stylesheet" href="ekran.css">
<link rel="stylesheet" href="koyu.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#DCE9DE;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
.pair{display:flex;gap:40px;width:820px;height:844px}
.wall{position:absolute;inset:0;background-size:cover;background-position:center}
.wall.L{background-image:url(/_blob/564f379c722a959a6f9b0909ac8e9f3a)}
.wall.D{background-image:url(/_blob/e7ec12ccfd48402845ca6ffd6f895d8b)}
.band{position:absolute;left:0;right:0;top:0;height:132px;background:linear-gradient(180deg,#D9E8F7 0,#D9E8F7 40%,rgba(217,232,247,0));pointer-events:none}
.dark .band{background:linear-gradient(180deg,#000 0,#000 40%,rgba(0,0,0,0))}
.top{position:absolute;left:16px;right:16px;top:52px;display:flex;gap:8px;align-items:center}
.who{flex:1;min-width:0;height:52px;border-radius:999px;display:flex;align-items:center;gap:10px;padding:0 2px 0 6px}
.who .ib{width:40px;height:44px}
.who .av{width:40px;height:40px;font-size:15px}
.who .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.who .nm b{font:600 16px/20px var(--font);color:var(--text)}
.who .nm span{font:500 12px/16px var(--font);color:var(--muted)}
.hb{display:flex;align-items:center;gap:0;flex:none}
.ib{width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--text);flex:none;background:none;border:0}
.flow{position:absolute;left:12px;right:12px;bottom:114px;display:flex;flex-direction:column;gap:2px}
.flow .day{margin:10px 0 8px;background:var(--glass-bg);border:1px solid var(--glass-line);color:var(--text)}
.dark .flow .day{background:#121614}
.msg{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;max-width:78%}
.msg .s{margin-left:auto;font:600 11px/14px var(--font);display:flex;align-items:center;gap:2px;padding-top:4px}
.msg.them .s{color:var(--bubble-them-muted)}
.msg.me .s{color:var(--bubble-mine-muted)}
.msg.me .s svg{color:var(--read)}
.dark .msg.me .s{color:#4A6550}
.dark .msg.me .s svg{color:#2C63D6}
.msg.g.them{border-radius:18px}
.msg.g.me{border-radius:18px}
.gap{height:8px}
.phone{--bubble-dm:#0E8745}
.dark.pA{--bubble-dm:#0B783D}
.msg.them{box-shadow:0 4px 12px rgba(14,135,69,.22)}
.dark .msg.them{box-shadow:none}
.q{width:100%;border-radius:10px;padding:6px 10px;background:rgba(255,255,255,.18);border-left:0;display:flex;flex-direction:column;font:500 13px/17px var(--font);color:rgba(255,255,255,.88)}
.q b{font:700 12px/16px var(--font);color:#FFFFFF}
.rxs{align-self:flex-start;display:flex;gap:6px;margin:4px 0 6px 0}
.rx{height:30px;padding:0 10px 0 4px;border-radius:999px;display:flex;align-items:center;gap:4px;background:var(--surface);box-shadow:var(--shadow-raised);font:600 12px/16px var(--font);color:var(--text);position:relative;z-index:1}
.dark .rx{background:#1B211F}
.rx svg{width:22px;height:22px}
.new{align-self:stretch;display:flex;align-items:center;gap:8px;margin:8px 0;font:600 12px/16px var(--font);color:var(--text)}
.new span{padding:4px 12px;border-radius:999px;background:var(--glass-bg);border:1px solid var(--glass-line)}
.dark .new span{background:#121614}
.new i{flex:1;height:1px;background:var(--hair)}
.dark .new i{background:rgba(255,255,255,.22)}
.typing{align-self:flex-start;margin-top:6px;height:34px;padding:0 14px;border-radius:18px 18px 18px 6px;background:var(--bubble-dm);display:flex;align-items:center;gap:5px}
.typing i{width:8px;height:8px;border-radius:50%;background:#FF4F8B}
.typing i:nth-child(2){background:#FFB547;transform:translateY(-3px)}.typing i:nth-child(3){background:#7DB2FF}
.cmp{position:absolute;left:12px;right:12px;bottom:46px;display:flex;gap:8px;align-items:center}
.cmp .round{width:44px;height:44px}
.fld{flex:1;min-width:0;height:52px;border-radius:26px;display:flex;align-items:center;gap:2px;padding:0 6px;background:var(--glass-bg);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow);font:500 15px/22px var(--font);color:var(--placeholder)}
.fld .ph{flex:1;min-width:0;padding-left:4px}
.fld .ib{width:40px;height:40px;flex:none;color:var(--muted);--ci-a:var(--muted);--ci-b:var(--muted);--ci-bo:.6}
.snd{width:44px;height:44px;border-radius:999px;border:0;display:flex;align-items:center;justify-content:center;background:var(--disabled);color:var(--on-disabled);flex:none;--ci-a:var(--on-disabled);--ci-b:var(--on-disabled)}
.down{position:absolute;right:16px;bottom:166px;display:none}
/*ED*/
.s .edt{font-weight:500;font-style:italic;margin-right:4px;opacity:.9}
.eb{position:absolute;left:12px;right:12px;bottom:106px;display:flex;align-items:center;gap:10px;padding:8px 6px 8px 14px;border-radius:20px;background:var(--glass-bg);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow);--ci-a:var(--text);--ci-b:var(--muted)}
.dark .eb{background:#121614;border-color:rgba(255,255,255,.08);--ci-a:#EEF3F0;--ci-b:rgba(238,243,240,.45)}
.eb .ci{width:20px;height:20px;flex:none}
.eb .et2{flex:1;min-width:0;display:flex;flex-direction:column}
.eb b{font:700 13px/17px var(--font);color:var(--text)}
.eb span{font:500 13px/17px var(--font);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eb .x{width:36px;height:36px;border:0;border-radius:18px;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center}
.eb .x .ci{width:18px;height:18px}
.fld .val{flex:1;min-width:0;padding-left:4px;color:var(--text);white-space:nowrap;overflow:hidden}
.fld .val i{display:inline-block;width:2px;height:20px;margin-left:1px;vertical-align:-4px;background:var(--accent)}
.dark .fld .val i{background:#3DDC84}
.snd{width:52px;height:52px;flex:none;border:0;border-radius:26px;background:#031B0B;color:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(3,27,11,.18)}
.dark .snd{background:rgba(255,255,255,.94);color:#0B0E0D;box-shadow:none}
.snd .ci{width:22px;height:22px}
.msg.edg{outline:2px solid var(--text);outline-offset:2px}
.dark .msg.edg{outline-color:#EEF3F0}
/*EDEND*/
.flow{bottom:178px}
.kb{height:292px;background:#D2D8D4;padding:8px 3px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:11px;position:relative}
.dark .kb{background:#1A1D1C}
.kr{display:flex;gap:5px;justify-content:center}
.kr.r2{padding:0 9px}
.k{flex:1;height:43px;border-radius:6px;background:#FFFFFF;box-shadow:0 1px 0 rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;font:400 21px/1 -apple-system,system-ui,sans-serif;color:#000}
.dark .k{background:#4A4D4C;color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.6)}
.k.f{background:#ABB3AE;font-size:15px}
.dark .k.f{background:#2E3130}
.k svg{width:22px;height:22px}
.w2{flex:1.5}.w3{flex:2.2}
.k.sp{flex:5.4;font-size:15px;color:#333}
.dark .k.sp{color:#ddd}
.hbar{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#000}
.dark .hbar{background:#fff}
.kbx{position:absolute;left:0;right:0;bottom:0;z-index:5}
.cmp{bottom:304px}
.eb{bottom:364px}
.flow{bottom:436px;z-index:0}
.band{z-index:1}.top{z-index:2}
.band2{display:none}
</style>
</helmet>
<div class="pair">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div class="{{t.cls}}">
<div class="wall {{t.k}}"></div>
<div class="band"></div>

<div class="top">
<button class="round soft" aria-label="Geri"><svg class="ci" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<div class="glass who">
<span class="av c2">F</span>
<div class="nm"><b>Fevve</b><span>Profili gör</span></div>
<div class="hb"><button class="ib" aria-label="Sohbette ara"><svg class="ci md" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.4" cy="10.4" r="6.4" class="o"></circle><rect x="14.4" y="15.6" width="7.6" height="3.4" rx="1.7" transform="rotate(45 18.2 17.3)" class="a"></rect></svg></button>
<button class="ib" aria-label="Diğer"><svg class="ci md" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2.2" class="a"></circle><circle cx="12" cy="12" r="2.2" class="a"></circle><circle cx="12" cy="19" r="2.2" class="a"></circle></svg></button></div>
</div>
</div>

<div class="flow">
<span class="day">Dün</span>
<p class="msg them g">Selam, bu akşam çıkıyor musun?<span class="s">22:02</span></p>
<p class="msg them">Kampüstekiler toplanıyormuş<span class="s">22:02</span></p>
<div class="gap"></div>
<p class="msg me g">Bu akşam Lale'de misin?<span class="s">22:10</span></p>
<p class="msg me edg">Vampir masası kuruluyor<span class="s">22:10<svg width="16" height="16" viewBox="0 0 24 24" role="img" aria-label="Okundu"><path d="M2.5 12.8l4.2 4.2L15 8.4M10.4 16.4l.6.6 8.4-8.6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></p>
<div class="gap"></div>
<p class="msg them">Geliyorum, 10 dk<span class="s">22:14</span></p>
<div class="rxs"><span class="rx"><svg width="22" height="22" role="img" aria-label="Bayıldım" viewBox="0 0 48 48"><defs><clipPath id="rxa{{t.k}}"><circle cx="24" cy="24" r="24"></circle></clipPath></defs><g clip-path="url(#rxa{{t.k}})"><circle cx="24" cy="24" r="24" fill="#FF5C93"></circle><g transform="translate(24 0) scale(1.7143) translate(-24 -8)"><g><rect x="10" y="8" width="28" height="56" rx="14" fill="#FF5C93"></rect><path d="M30 10a14 14 0 0 1 8 12v42h-8z" fill="#031B0B" opacity="0.12"></path><rect x="14" y="15" width="20" height="11" rx="5.5" fill="#fff"></rect><path d="M20 22.84C15.92 20.2 16.88 17.08 20 19C23.12 17.08 24.08 20.2 20 22.84Z" fill="#FF4F8B"></path><path d="M28 22.84C23.92 20.2 24.88 17.08 28 19C31.12 17.08 32.08 20.2 28 22.84Z" fill="#FF4F8B"></path><path d="M20.2 28.8q3.8 3.4 7.6 0" stroke="#031B0B" stroke-width="1.7" fill="none" stroke-linecap="round"></path><ellipse cx="15.4" cy="28.2" rx="2.1" ry="1.2" fill="#FF6FA3" opacity=".6"></ellipse><ellipse cx="32.6" cy="28.2" rx="2.1" ry="1.2" fill="#FF6FA3" opacity=".6"></ellipse></g></g></g></svg>1</span><span class="rx"><svg width="22" height="22" role="img" aria-label="Kahkaha" viewBox="0 0 48 48"><defs><clipPath id="rxk{{t.k}}"><circle cx="24" cy="24" r="24"></circle></clipPath></defs><g clip-path="url(#rxk{{t.k}})"><circle cx="24" cy="24" r="24" fill="#F2B53A"></circle><g transform="translate(24 0) scale(1.7143) translate(-24 -8)"><g><rect x="10" y="8" width="28" height="56" rx="14" fill="#F2B53A"></rect><path d="M30 10a14 14 0 0 1 8 12v42h-8z" fill="#031B0B" opacity="0.12"></path><rect x="14" y="15" width="20" height="11" rx="5.5" fill="#fff"></rect><path d="M17.8 18.4l3.9 2.2-3.9 2.2M30.2 18.4l-3.9 2.2 3.9 2.2" stroke="#031B0B" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><path d="M14.8 22.4q-1.5 2.3 0 3.4q1.5-1.1 0-3.4z" fill="#5CB8FF"></path><path d="M33.2 22.4q-1.5 2.3 0 3.4q1.5-1.1 0-3.4z" fill="#5CB8FF"></path><path d="M18.8 28h10.4q-.4 5.6-5.2 5.6T18.8 28z" fill="#031B0B"></path><path d="M21.4 31.8q2.6-1.8 5.2 0q-1 1.5-2.6 1.5t-2.6-1.5z" fill="#FF6F8E"></path></g></g></g></svg>2</span></div>
<span class="day">Bugün</span>
<p class="msg them">Nerelerdesin?<span class="s">18:10</span></p>
</div>

<div class="eb"><svg class="ci" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.8" y="9.6" width="16.4" height="5" rx="2.5" transform="rotate(-45 11 12.1)" class="a"></rect><rect x="3" y="19" width="18" height="2.6" rx="1.3" class="b"></rect></svg><div class="et2"><b>Mesajı düzenle</b><span>Vampir masası kuruluyor</span></div><button class="x" aria-label="Düzenlemeyi iptal et"><svg class="ci" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11m0-11-11 11" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"></path></svg></button></div>
<div class="cmp">
<label class="fld">
<span class="ib" aria-label="Emoji" role="img"><svg class="ci" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" class="b"></circle><circle cx="9" cy="10.4" r="1.5" class="a"></circle><circle cx="15" cy="10.4" r="1.5" class="a"></circle><path d="M8.4 14.2c1.9 2 5.3 2 7.2 0" fill="none" stroke="var(--ci-a,currentColor)" stroke-width="2.2" stroke-linecap="round"></path></svg></span>
<span class="val">Vampir masası 9'da kuruluyor<i></i></span></label>
<button class="snd" aria-label="Düzenlemeyi kaydet"><svg class="ci" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.6l4.6 4.6L19 7.6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
</div>
<div class="kb kbx" aria-hidden="true"><div class="kr"><span class="k ">q</span><span class="k ">w</span><span class="k ">e</span><span class="k ">r</span><span class="k ">t</span><span class="k ">y</span><span class="k ">u</span><span class="k ">ı</span><span class="k ">o</span><span class="k ">p</span><span class="k ">ğ</span><span class="k ">ü</span></div><div class="kr r2"><span class="k ">a</span><span class="k ">s</span><span class="k ">d</span><span class="k ">f</span><span class="k ">g</span><span class="k ">h</span><span class="k ">j</span><span class="k ">k</span><span class="k ">l</span><span class="k ">ş</span><span class="k ">i</span></div><div class="kr"><span class="k f w2"><svg viewBox="0 0 24 24"><path d="M12 4 4 12.5h4.5V20h7v-7.5H20Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg></span><span class="k ">z</span><span class="k ">x</span><span class="k ">c</span><span class="k ">v</span><span class="k ">b</span><span class="k ">n</span><span class="k ">m</span><span class="k ">ö</span><span class="k ">ç</span><span class="k f w2"><svg viewBox="0 0 24 24"><path d="M9 5h11v14H9l-6-7Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path><path d="m12 9 6 6m0-6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg></span></div><div class="kr"><span class="k f w3">123</span><span class="k f w2">🙂</span><span class="k sp">boşluk</span><span class="k f w3">ara</span></div><i class="hbar"></i></div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { themes: [ { cls: 'phone', k: 'L' }, { cls: 'phone dark pA', k: 'D' } ] };
}
}
</script>
</body>
</html>
