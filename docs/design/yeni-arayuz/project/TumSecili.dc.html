<style>
body{margin:0;background:#DCE9DE;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
.pair{display:flex;gap:40px;width:820px;height:844px}
.hd{display:flex;align-items:center;justify-content:space-between}
.acts{display:flex;gap:8px}
.round{position:relative}
.round .nd{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--buzz);border:2px solid var(--canvas)}
.srch{background:var(--glass-bg);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow);color:var(--placeholder);--ci-a:var(--muted);--ci-b:var(--muted)}
.sg{background:var(--glass-bg);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow);height:44px;padding:4px}
.sg span{gap:6px}
.dark .sg span.on{background:rgba(255,255,255,.94);color:#0B0E0D}
.cnt{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--buzz);color:var(--on-buzz);font:700 11px/20px var(--font);text-align:center;box-sizing:border-box}
.lbl{display:flex;align-items:center;gap:6px;font:600 12px/16px var(--font);letter-spacing:.24px;color:var(--muted);padding:0 4px;--ci-a:var(--muted);--ci-b:var(--muted)}
.lst{padding:0;display:flex;flex-direction:column;margin:0 -20px}
.rw{padding:10px 20px!important}
.rw+.rw:before{display:none!important}
.lst+.lst{margin-top:8px}
.rw{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:72px;position:relative}
.rw+.rw:before{content:"";position:absolute;top:0;left:76px;right:16px;border-top:1px solid var(--hair)}
.rw .av{width:48px;height:48px;font-size:17px}
.mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.l1,.l2{display:flex;align-items:center;gap:8px}
.nm{font:600 16px/22px var(--font);color:var(--text);flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.tm{font:500 13px/18px var(--font);color:var(--muted);flex:none}
.tm.new{color:var(--accent);font-weight:700}
.pv{font:500 15px/22px var(--font);color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent);display:flex;align-items:center;gap:4px}
.pv.un{color:var(--text);font-weight:600}
.pv.first{font-style:italic}
.tick{width:18px;height:18px;flex:none;color:var(--read)}
.mu{width:16px;height:16px;flex:none;--ci-a:var(--muted);--ci-b:var(--muted)}
.arc{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-radius:999px;color:var(--text);font:600 15px/22px var(--font);--ci-a:var(--muted);--ci-b:var(--muted)}
.arc .n{margin-left:auto;font:600 13px/18px var(--font);color:var(--muted)}
.chev{width:18px;height:18px;color:var(--muted)}
.tb{position:absolute;left:16px;right:16px;bottom:34px;height:68px;border-radius:999px;display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.ti{width:68px;height:56px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font:600 11px/14px var(--font)}
.ti .ci{width:22px;height:22px}
.ti.on{background:#FFFFFF;color:var(--text);box-shadow:var(--shadow-raised)}
.ti.on .ci{--ci-a:var(--accent);--ci-b:var(--buzz);--ci-bo:1}
.dark .ti.on{background:rgba(255,255,255,.94);color:#031B0B}
.dark .ti.on .ci{--ci-a:#0B783D}
.aura{display:none}
.ta{position:absolute;inset:0;padding:52px 0 0;display:flex;flex-direction:column}
.ptb{display:flex;align-items:center;gap:12px;height:48px;padding:0 20px;flex:none}
.ptb .round{--ci-a:var(--text);color:var(--text)}
.dark .ptb .round{background:#121614;border-color:rgba(255,255,255,.08);box-shadow:none;color:#EEF3F0}
.ptb h1{flex:1;margin:0;font:700 19px/24px var(--font);letter-spacing:-.3px;color:var(--text)}
.ptb h1 small{display:block;font:500 12px/16px var(--font);color:var(--muted);letter-spacing:0}
.cats{display:flex;gap:6px;padding:12px 20px 10px;overflow:hidden;white-space:nowrap;flex:none}
.cats span{flex:none;height:32px;padding:0 13px;border-radius:999px;display:flex;align-items:center;gap:5px;font:600 13px/16px var(--font);color:var(--muted);background:var(--surface2)}
.cats span em{font-style:normal;font-weight:500;opacity:.7}
.dark .cats span{background:#1B211F;color:rgba(238,243,240,.6)}
.cats span.on{background:#031B0B;color:#fff}
.dark .cats span.on{background:rgba(255,255,255,.94);color:#0B0E0D}
.xl{flex:1;overflow:hidden;position:relative}
.lin{position:absolute;left:0;right:0;top:0}
.xs{display:flex;align-items:baseline;justify-content:space-between;padding:16px 20px 6px;font:700 16px/22px var(--font);color:var(--text)}
.xs span{font:500 12px/16px var(--font);color:var(--muted)}
.gg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;padding:6px 20px 8px}
.gc{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.th{width:72px;height:72px;border-radius:50%;background:var(--surface2);flex:none;position:relative}
.dark .th{background:#1B211F}
.th svg{width:100%;height:100%;display:block;border-radius:50%}
.th img{position:absolute;width:142px;height:142px;left:-35px;top:-15px;clip-path:circle(36px at 71px 51px)}
.gc.on .th{box-shadow:0 0 0 3px var(--canvas),0 0 0 6px #FF4F8B}
.dark .gc.on .th{box-shadow:0 0 0 3px #000,0 0 0 6px #FF6FA0}
.gc p{margin:0;max-width:100%;font:600 12px/15px var(--font);color:var(--text);text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;height:30px}
.gc.on p{font-weight:700}
.d{position:absolute;right:3px;top:3px;width:9px;height:9px;transform:rotate(45deg);border-radius:2px;box-shadow:0 0 0 2px var(--canvas)}
.dark .d{box-shadow:0 0 0 2px #000}
.d.destansi{background:#7B5CFF}.d.efsanevi{background:#FFB547}

.fade{position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(180deg,rgba(239,247,241,0),var(--canvas) 70%);pointer-events:none}
.dark .fade{background:linear-gradient(180deg,rgba(0,0,0,0),#000 70%)}

.fx{position:absolute;left:20px;right:20px;bottom:30px;z-index:4;display:flex;flex-direction:column;align-items:stretch;gap:8px}
.fx .btn{height:56px;width:100%;font:600 16px/20px var(--font)}
.fx .cap{margin:0;text-align:center;font:500 13px/18px var(--font);color:var(--muted)}
.fx .ob{align-self:center;font:700 9px/13px var(--font);letter-spacing:.4px;color:var(--accent);background:var(--surface2);border-radius:999px;padding:1px 7px}
.dark .fx .ob{background:#1B211F;color:#3DDC84}
.dark .fx .cap{color:rgba(238,243,240,.6)}
.ptb .fld{flex:1;min-width:0;height:48px;border-radius:24px;display:flex;align-items:center;gap:6px;padding:0 6px 0 14px;background:var(--glass-bg);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow);font:500 16px/22px var(--font);color:var(--text);--ci-a:var(--muted);--ci-b:var(--muted)}
.dark .ptb .fld{background:#121614;border-color:rgba(255,255,255,.08);box-shadow:none;color:#EEF3F0}
.fld .ci{width:20px;height:20px;flex:none;color:var(--muted)}
.fld .val{flex:1;min-width:0}
.fld .val i{display:inline-block;width:2px;height:20px;margin-left:1px;vertical-align:-4px;background:var(--accent)}
.dark .fld .val i{background:#3DDC84}
.fld .clr{background:none;border:0;padding:0;width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--muted)}
.emp{display:flex;flex-direction:column;align-items:center;text-align:center;padding:72px 32px 0}
.emp img{width:180px;height:auto;display:block}
.emp .et{margin:14px 0 0;font:700 17px/22px var(--font);color:var(--text)}
.emp .ed{margin:4px 0 0;max-width:260px;font:500 14px/20px var(--font);color:var(--muted)}
.dark .emp .ed{color:rgba(238,243,240,.6)}
.ta .kb{flex:none}
.kb{height:292px;background:#D2D8D4;padding:8px 3px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:11px;position:relative}
.dark .kb{background:#1A1D1C}
.kr{display:flex;gap:5px;justify-content:center}
.kr.r2{padding:0 9px}
.k{flex:1;height:43px;border-radius:6px;background:#FFFFFF;box-shadow:0 1px 0 rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;font:400 21px/1 -apple-system,system-ui,sans-serif;color:#000}
.dark .k{background:#4A4D4C;color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.6)}
.k.f{background:#ABB3AE;font-size:15px}
.dark .k.f{background:#2E3130}
.k svg{width:22px;height:22px}
.w2{flex:1.5}.w3{flex:2.2}
.k.sp{flex:5.4;font-size:15px;color:#333}
.dark .k.sp{color:#ddd}
.hb{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#000}
.dark .hb{background:#fff}
/*TB2*/
.tb{left:20px;right:20px;bottom:30px;height:60px;padding:0 5px;gap:2px;box-shadow:0 6px 18px rgba(3,27,11,.08),0 0 0 1px rgba(3,27,11,.04)}
.dark .tb{box-shadow:0 0 0 1px rgba(255,255,255,.07)}
.ti{flex:1 1 0;min-width:0;width:auto;height:50px;gap:3px;font:600 10px/13px var(--font);letter-spacing:.1px;white-space:nowrap}
.ti .ci{width:20px;height:20px}
.ti.on{flex:1 1 0;padding:0;background:#031B0B;color:#FFFFFF;box-shadow:0 4px 12px rgba(3,27,11,.18)}
.ti.on .ci{--ci-a:#3DDC84;--ci-b:#FF6FA0}
.dark .ti.on{background:rgba(255,255,255,.94);color:#0B0E0D;box-shadow:none}
.dark .ti.on .ci{--ci-a:#0B783D;--ci-b:#FF4F8B}
.dark .ti{color:rgba(238,243,240,.55)}
