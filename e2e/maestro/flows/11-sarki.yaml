# Şarkıda Geçsin (docs/SPEC_V3.md §20.4): this phone starts and sings (Söyledik); the bot table lets
# it pass, sings back and this phone objects (its objections drop to 2). The last two words show a
# 5-second clock (a screenshot; the pure and integration tests check the seconds); they run out
# and the result shows.
appId: app.kabuk.mobile
---
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: leave
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: checkin
      BODY: '{"spot":"kutuphane","headcount":2}'
- tapOn:
    id: tab-venue
# "Masanı lobiye aç", the bot asks to join, "Kabul" on the venue, "Masaya git" (§23.C).
- runFlow:
    file: open-lobby-accept.yaml
- extendedWaitUntil:
    visible:
      id: propose-sarki
    timeout: 15000
- tapOn:
    id: propose-sarki
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: answer-game
- extendedWaitUntil:
    visible:
      id: turn-start
    timeout: 20000
- tapOn:
    id: turn-start
- extendedWaitUntil:
    visible:
      id: say-said
    timeout: 15000
- takeScreenshot: 50-sarki-said
- tapOn:
    id: say-said
# The bot table lets it pass, then sings; this phone objects.
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: say-claim
# The window is held so the emulator's slow tap lands inside it.
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: say-hold
# The word and İtiraz on screen together, with the clock (no scrolling).
- extendedWaitUntil:
    visible:
      id: say-object
    timeout: 15000
- tapOn:
    id: say-object
- extendedWaitUntil:
    visible: tarafın · 2 hak
    timeout: 20000
- takeScreenshot: 51-sarki-objected
# The last two words: 5 seconds a line.
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: say-expire
      BODY: '{"toRound":7}'
# (No wait on the 5-second clock text: a screen read can take longer than both words.)
- takeScreenshot: 52-sarki-short
# Words 7 and 8 run out on the clock (either phone advances): the game ends.
- extendedWaitUntil:
    visible:
      id: last-game
    timeout: 40000
- takeScreenshot: 53-sarki-result
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: end-room
- extendedWaitUntil:
    visible: Tanışalım mı\?
    timeout: 20000
- tapOn:
    id: reveal-no
- extendedWaitUntil:
    visible: Güzel oyundu.*
    timeout: 15000
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: reveal
      BODY: '{"yes":false}'
- tapOn: Mekana dön
- extendedWaitUntil:
    visible:
      id: lobby-open
    timeout: 15000
