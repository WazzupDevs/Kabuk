# G1: the first screen, then the seven sign-up steps (docs/SPEC_V4.md §4.C, the v45 report §1):
# "Başlamadan önce" before the phone (K-33), the test number and its code, the name, the birth date
# and the gender, then the photo. First an under-18 birth date: the account is deleted and the
# first screen says why; then the real sign-up.
appId: app.kabuk.mobile
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: welcome
    timeout: 60000
# The launch curtain (src/features/launch/LaunchCurtain.tsx) mounts before the first screen and
# opens onto it; the scene plays once after it (v45 §2, K-27) and "Geç" shows while it runs. E2E's
# emulator runs with animations off, which Android reports as reduce motion: there the scene comes
# at its end and "Geç" never shows, so the flow cannot require it. On a phone with motion the tap
# skips the scene; either way "Geç" is gone within its 4.5 s.
- extendedWaitUntil:
    notVisible:
      id: launch-curtain
    timeout: 15000
- tapOn:
    id: intro-skip
    optional: true
- extendedWaitUntil:
    notVisible:
      id: intro-skip
    timeout: 10000
- takeScreenshot: 01-welcome
- runFlow:
    file: login-code.yaml
- extendedWaitUntil:
    visible:
      id: signup-name-step
    timeout: 20000
# 1 January, 17 years ago: 17 on any day of the year.
- evalScript: ${output.underAgeYear = String(new Date().getFullYear() - 17)}
- runFlow:
    file: about-you.yaml
    env:
      NAME: Genç Masa
      DAY: '01'
      MONTH: '01'
      YEAR: ${output.underAgeYear}
- extendedWaitUntil:
    visible:
      id: under-age
    timeout: 20000
- assertVisible: skall 18 yaş ve üzeri içindir
- takeScreenshot: 03a-under-age
# The account was deleted; the same number signs up again from the first screen.
- tapOn: Kapat
- extendedWaitUntil:
    visible:
      id: welcome
    timeout: 10000
- runFlow:
    file: login-code.yaml
- extendedWaitUntil:
    visible:
      id: signup-name-step
    timeout: 20000
- takeScreenshot: 03b-name
- runFlow:
    file: about-you.yaml
    env:
      NAME: Cihaz Masa
      DAY: '15'
      MONTH: '01'
      YEAR: '2000'
- extendedWaitUntil:
    visible:
      id: signup-photo-step
    timeout: 20000
- takeScreenshot: 03c-photo
# "Fotoğraf ekle" opens the library or camera sheet (v45: one button under the empty circle).
- tapOn:
    id: signup-photo-add
- extendedWaitUntil:
    visible:
      id: photo-from-library
    timeout: 10000
- takeScreenshot: 03d-photo-sheet
- tapOn:
    id: photo-cancel
- extendedWaitUntil:
    notVisible:
      id: photo-from-library
    timeout: 10000
# The profile is sent: Android's back leaves the last step where it is.
- pressKey: back
- assertVisible:
    id: signup-photo-step
# No photo: the last step's button is "Fotoğrafsız bitir" (K-29).
- assertVisible: Fotoğrafsız bitir
- tapOn:
    id: signup-finish
- extendedWaitUntil:
    visible: Liste
    timeout: 20000
- takeScreenshot: 04-explore
