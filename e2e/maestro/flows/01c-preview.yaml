# Eski oyun (outside the visual gate): step 4.2's game grounds with their chips, the judge buttons,
# the chat themes and İbre's zones in the run's scheme, for the owner's approval of the dark tones;
# then step 4.2b's game parts on their grounds: the game buttons, the timer bar and the ring (each
# also in its last seconds), then the toast, 3-2-1 and confetti on a press.
