# Step 4.3: the capsule avatar in long lists (the CTO's 4.2b review). The emulator's numbers only
# show the meter works; the measurement is on a low-end phone.
- tapOn:
    id: preview-open
- extendedWaitUntil:
    visible:
      id: preview-set-measure
    timeout: 10000
- tapOn:
    id: preview-set-measure
- extendedWaitUntil:
    visible:
      id: measure-cached
    timeout: 10000
# The list is 384 dp tall: bring all of it on screen (the meter sits right above it), then swipe at
# fixed points inside it. A swipe from the list's own bounds can start in the gesture-navigation
# strip at the bottom and send the app home.
- scrollUntilVisible:
    element:
      id: measure-chat
    timeout: 30000
- repeat:
    times: 3
    commands:
      - swipe:
          start: 50%, 80%
          end: 50%, 45%
- assertVisible:
    id: measure-stats
- takeScreenshot: 04n-measure
- back
- extendedWaitUntil:
    visible:
      id: preview-open
    timeout: 10000
# v46 native, step 2: the app's v46 gallery (Ayarlar → Tasarım (test) → v46 galeri), in the run's
# scheme: the colours, then the components (v46's measured boxes until each is rewritten in src/ui).
- scrollUntilVisible:
    element:
      id: v46-gallery-open
    timeout: 30000
- tapOn:
    id: v46-gallery-open
- extendedWaitUntil:
    visible:
      id: gal-colors
    timeout: 10000
- takeScreenshot: 04v-v46-gallery-colors
# The 60 type styles stand between the colours and the components: at 320 dp a 30 s scroll ended
# mid-way through them on CI's emulator (e2e run 39394491623).
- scrollUntilVisible:
    element:
      id: gal-birincil-52
    centerElement: true
    timeout: 90000
- takeScreenshot: 04v-v46-gallery-components
- back
- extendedWaitUntil:
    visible:
      id: v46-gallery-open
    timeout: 10000
- back
