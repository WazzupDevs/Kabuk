- extendedWaitUntil:
    visible:
      id: reaction-bar
    timeout: 10000
- takeScreenshot: 04i-chat-reaction-bar
- tapOn:
    id: react-5
- extendedWaitUntil:
    notVisible:
      id: reaction-bar
    timeout: 10000
- scrollUntilVisible:
    element:
      id: reply-strip
    centerElement: true
    timeout: 30000
- takeScreenshot: 04i-chat-reply
# The new-message list has its own scroll: a swipe from the middle of the screen scrolls that list
# once it is under the finger (at the largest text size it is). The page is swiped in its left
# margin instead.
- repeat:
    while:
      notVisible:
        id: preview-incoming
    times: 8
    commands:
      - swipe:
          start: 3%, 80%
          end: 3%, 35%
          duration: 400
- tapOn:
    id: preview-incoming
- extendedWaitUntil:
    visible:
      id: chat-new-messages
    timeout: 10000
- takeScreenshot: 04i-chat-new-message
- tapOn:
    id: chat-new-messages
- extendedWaitUntil:
    notVisible:
      id: chat-new-messages
    timeout: 10000
# The preview and Ayarlar are scrolled down; the system back key leaves both without scrolling up.
- back
- extendedWaitUntil:
