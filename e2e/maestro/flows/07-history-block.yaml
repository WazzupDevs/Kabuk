# F7: block the bot table from the play history; the friendship ends with it.
appId: app.kabuk.mobile
---
# Aktiviteler → Geçmiş (docs/SPEC_V4.md K-15): the record with the bot table, under its day; it
# opens the record's actions (Bildirimler lists friend requests and invites, skall tuvali).
- tapOn:
    id: tab-activities
- tapOn:
    id: activities-tab-history
- extendedWaitUntil:
    visible:
      id: history-row-.*
    timeout: 15000
- takeScreenshot: 30a-activities-history
- tapOn:
    id: history-row-.*
    index: 0
- extendedWaitUntil:
    visible:
      id: history-more
    timeout: 10000
- takeScreenshot: 30b-activities-record
- tapOn:
    id: history-more
    index: 0
- extendedWaitUntil:
    visible: Bu kişi
    timeout: 10000
- takeScreenshot: 31-history-menu
- tapOn:
    id: menu-block
- extendedWaitUntil:
    visible: Bu kişiyi engellemek istiyor musun\?
    timeout: 10000
- takeScreenshot: 32-block-confirm
- tapOn:
    id: confirm-action
- extendedWaitUntil:
    notVisible: Bu kişiyi engellemek istiyor musun\?
    timeout: 10000
# The block may close the record's sheet by itself.
- tapOn:
    id: history-sheet-close
    optional: true
- extendedWaitUntil:
    notVisible:
      id: history-sheet-close
    timeout: 10000
- tapOn:
    id: tab-messages
- extendedWaitUntil:
    visible: Henüz mesajın yok.
    timeout: 15000
- takeScreenshot: 33-messages-after-block
