# Diagnostic (WazzupDevs/Kabuk#206, not to be merged): the tabs before the Keşfet map opens, from
# the map to other tabs, and again once the map is closed (list), a screenshot and the surface
# layers (bot `dump`) at each (0.6.0: a black band stayed at the bottom of the next screen; on
# Android 15 and 16 emulators the navigation bar's strip turns black after the map).
appId: app.kabuk.mobile
---
- tapOn:
    id: tab-activities
- extendedWaitUntil:
    visible:
      id: activities-no-events
    timeout: 10000
- takeScreenshot: diag-pre-activities
- tapOn:
    id: tab-profile
- evalScript: ${const end = Date.now() + 3000; while (Date.now() < end) {} }
- takeScreenshot: diag-pre-profile
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: dump
      BODY: '{"name":"m0-pre"}'
- tapOn:
    id: tab-explore
- scrollUntilVisible:
    element:
      text: E2E Kafe
    timeout: 30000
- tapOn: Harita
- extendedWaitUntil:
    visible:
      id: explore-map-ready
    timeout: 30000
- evalScript: ${const end = Date.now() + 4000; while (Date.now() < end) {} }
- takeScreenshot: diag-map
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: dump
      BODY: '{"name":"m1-map"}'
- tapOn:
    id: tab-activities
- extendedWaitUntil:
    visible:
      id: activities-no-events
    timeout: 10000
- evalScript: ${const end = Date.now() + 3000; while (Date.now() < end) {} }
- takeScreenshot: diag-map-left-activities
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: dump
      BODY: '{"name":"m2-map-left"}'
- tapOn:
    id: tab-explore
- extendedWaitUntil:
    visible:
      id: explore-map-ready
    timeout: 30000
- tapOn: Liste
- scrollUntilVisible:
    element:
      text: E2E Kafe
    timeout: 30000
- tapOn:
    id: tab-activities
- extendedWaitUntil:
    visible:
      id: activities-no-events
    timeout: 10000
- evalScript: ${const end = Date.now() + 3000; while (Date.now() < end) {} }
- takeScreenshot: diag-list-left-activities
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: dump
      BODY: '{"name":"m3-list-left"}'
- tapOn:
    id: tab-explore
