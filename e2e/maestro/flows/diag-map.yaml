# Diagnostic (WazzupDevs/Kabuk#206, not to be merged): from the Keşfet map to other tabs and back,
# a screenshot at each (0.6.0: a black band stayed at the bottom of the next screen).
appId: app.kabuk.mobile
---
- tapOn:
    id: tab-explore
- scrollUntilVisible:
    element:
      text: E2E Kafe
    timeout: 30000
- tapOn: Harita
- extendedWaitUntil:
    visible:
      id: explore-map-ready
    timeout: 30000
- evalScript: ${const end = Date.now() + 4000; while (Date.now() < end) {} }
- takeScreenshot: diag-map
- tapOn:
    id: tab-activities
- extendedWaitUntil:
    visible:
      id: activities-no-events
    timeout: 10000
- takeScreenshot: diag-map-left-activities
- evalScript: ${const end = Date.now() + 3000; while (Date.now() < end) {} }
- takeScreenshot: diag-map-left-activities-3s
- tapOn:
    id: tab-profile
- evalScript: ${const end = Date.now() + 3000; while (Date.now() < end) {} }
- takeScreenshot: diag-map-left-profile
- tapOn:
    id: tab-explore
- extendedWaitUntil:
    visible:
      id: explore-map-ready
    timeout: 30000
- takeScreenshot: diag-map-back
- tapOn:
    id: tab-messages
- evalScript: ${const end = Date.now() + 3000; while (Date.now() < end) {} }
- takeScreenshot: diag-map-left-messages
- tapOn:
    id: tab-explore
- extendedWaitUntil:
    visible:
      id: explore-map-ready
    timeout: 30000
- tapOn: Liste
