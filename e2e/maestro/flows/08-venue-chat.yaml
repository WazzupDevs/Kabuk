# Venue chat room (docs/SPEC_V3.md §7): an anonymous message from this phone; a second bot account
# (the first is blocked since 07) writes with its profile; this phone opens its profile through the
# message and sends a friend request, which the bot accepts. A check-in has one venue chat mode
# (§22.G): the first "Gönder" asks for it once (anonymous; this phone has no photo, so "Profilimle"
# cannot be chosen), and after it the bar only names it.
appId: app.kabuk.mobile
---
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: login
      BODY: '{"second":true}'
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: checkin
      BODY: '{"spot":"kutuphane"}'
- tapOn:
    id: tab-venue
# Mekan's top first: the spot change before this flow (spot-kutuphane) leaves the page scrolled
# down to "Değiştir", and at the largest text size the card is then above the screen. At the top
# the card sits under the venue's name, clear of the floating tab bar and the Mekan tile (at the
# bottom of a 320 × 640 screen a tap on it would land on the tab).
- scrollUntilVisible:
    element:
      id: venue-name
    direction: UP
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: venue-chat-open
    timeout: 10000
- tapOn:
    id: venue-chat-open
- extendedWaitUntil:
    visible: E2E Kafe sohbeti
    timeout: 15000
- scrollUntilVisible:
    element:
      id: venue-chat-input
    timeout: 10000
- tapOn:
    id: venue-chat-input
- inputText: Selam mekan
- hideKeyboard
- tapOn:
    id: venue-chat-send
- extendedWaitUntil:
    visible: Bu mekanda kaldığın sürece mekan sohbetinde nasıl görüneceksin?
    timeout: 10000
- extendedWaitUntil:
    visible: Profilinle görünmek için profil fotoğrafı gerekiyor.
    timeout: 10000
- takeScreenshot: 35b-venue-chat-mode
- tapOn:
    id: venue-chat-mode-send
- extendedWaitUntil:
    visible: Anonim yazıyorsun
    timeout: 15000
- assertVisible:
    id: venue-chat-mine
- takeScreenshot: 36-venue-chat-mine
# The bot writes with its profile; this phone sees its photo beside the bubble and its name inside it,
# in its colour (v45: .vname).
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: venue-chat-send
      BODY: '{"body":"Bot İki burada","profiled":true}'
- scrollUntilVisible:
    element:
      text: Bot İki burada
    timeout: 20000
- takeScreenshot: 37-venue-chat-profiled
- tapOn: Bot İki
- extendedWaitUntil:
    visible:
      id: venue-chat-profile
    timeout: 15000
- takeScreenshot: 38-venue-chat-profile
- tapOn:
    id: venue-chat-request
- extendedWaitUntil:
    visible: İstek gönderilsin mi\?
    timeout: 10000
- takeScreenshot: 39-venue-chat-request-confirm
- tapOn:
    id: venue-chat-request-confirm
- extendedWaitUntil:
    visible:
      id: venue-chat-request-sent
    timeout: 15000
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: accept-friend
- scrollUntilVisible:
    element:
      text: Geri dön
    timeout: 10000
- tapOn: Geri dön
- scrollUntilVisible:
    element:
      text: Geri
    direction: UP
    timeout: 10000
- tapOn: Geri
- tapOn:
    id: tab-messages
- extendedWaitUntil:
    visible: Bot İki
    timeout: 20000
- takeScreenshot: 40-venue-chat-friend
