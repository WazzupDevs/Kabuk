# The table ended (docs/SPEC_V4.md §4.E): this phone sees Masa bitti, and "Mekana dön" goes back
# to the venue, which has no table now.
appId: app.kabuk.mobile
---
- extendedWaitUntil:
    visible:
      id: table-end
    timeout: 20000
- scrollUntilVisible:
    element:
      id: table-end-close
    direction: DOWN
    timeout: 10000
- tapOn:
    id: table-end-close
- extendedWaitUntil:
    visible:
      id: table-create-open
    timeout: 15000
