# From the first screen: "Başla", the two consents (step 1/7, before the phone; K-26, K-33), the
# test number (2/7) and its fixed code (3/7). Also the way back in for an existing account.
appId: app.kabuk.mobile
---
- tapOn:
    id: welcome-start
- extendedWaitUntil:
    visible:
      id: signup-consents
    timeout: 10000
- takeScreenshot: 01a-consents
# Unticked, every time (the boxes never carry over, not even after a sign-out): the button waits.
- assertVisible:
    id: consents-accept
    enabled: false
- tapOn: Kullanım Koşulları’nı okudum ve kabul ediyorum.
- tapOn: KVKK Aydınlatma Metni’ni okudum.
- tapOn:
    id: consents-accept
- extendedWaitUntil:
    visible:
      id: signup-phone
    timeout: 10000
- takeScreenshot: 01b-phone
- tapOn:
    id: phone-input
- eraseText
- inputText: '5550000001'
- hideKeyboard
- tapOn: Kod gönder
- extendedWaitUntil:
    visible: Kodu gir
    timeout: 20000
- takeScreenshot: 02-otp
- tapOn:
    id: otp-input
# Six digits verify on their own.
- inputText: '123456'
