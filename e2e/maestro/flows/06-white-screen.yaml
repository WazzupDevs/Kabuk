# V8: the bot's table ends while this phone sits at it; the phone moves to Masa bitti without a
# blank screen (docs/SPEC_V4.md §4.E). Before it, "Katıl" from the lobby (§4.E): a declined request
# looks like a timed-out one (rule 5); a request to the bot's next table is accepted and the table
# opens on its own.
appId: app.kabuk.mobile
---
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: login
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: checkin
      BODY: '{"spot":"kutuphane"}'
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: create-room
- tapOn:
    id: tab-venue
# Centred: at the bottom of a 320 × 640 screen a button sits under the floating tab bar.
- scrollUntilVisible:
    element:
      id: join-.*
    centerElement: true
    timeout: 20000
- takeScreenshot: 14-lobby
- tapOn:
    id: join-.*
- extendedWaitUntil:
    visible: 'İsteğin gönderildi. Yanıt bekleniyor \(\d+ sn\)\.'
    timeout: 15000
- takeScreenshot: 14b-lobby-waiting
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: decline-request
# Rule 5: a declined request looks like one that timed out, so the row says so only once the
# request's 60 s are up.
- extendedWaitUntil:
    visible: Masa şu an müsait değil.
    timeout: 80000
- takeScreenshot: 14c-lobby-unavailable
# A new table of the bot's this time; the bot accepts and the table opens after the row's note.
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: end-room
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: create-room
- extendedWaitUntil:
    notVisible: Masa şu an müsait değil.
    timeout: 20000
- scrollUntilVisible:
    element:
      id: join-.*
    centerElement: true
    timeout: 10000
- tapOn:
    id: join-.*
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: accept-request
- extendedWaitUntil:
    visible:
      id: table-top
    timeout: 20000
# A person at the table, not its owner: "Masadan ayrıl" and no owner's bar.
- assertVisible:
    id: table-leave-open
- assertNotVisible:
    id: table-invite
- takeScreenshot: 16-table-person
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: end-room
- runFlow:
    file: table-end-close.yaml
