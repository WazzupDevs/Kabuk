# The 0.6.0 phone test: on two phones (one a Galaxy S23) the v46 gallery's "320 dp" press closed the
# app. CI's emulator is 320 dp wide, where the press changes nothing (01c-preview), so this flow sets
# an S23's screen (1080 × 2340 at 420 dpi: 411 dp wide; the bot's `screen`, adb on the runner),
# opens the gallery straight from its link, presses "320 dp" and sets the emulator's screen back. A
# crash's stack is in the job's logcat-crash.txt (scripts/e2e/run-on-emulator.sh).
appId: app.kabuk.mobile
---
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: screen
      BODY: '{"size":"1080x2340","density":420}'
# A new density starts the app's screen again: the app opens anew, on the gallery.
- stopApp
- openLink: masa:///v46-gallery
- extendedWaitUntil:
    visible:
      id: gal-colors
    timeout: 60000
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: dump
      BODY: '{"name":"1-open"}'
- tapOn:
    id: v46-gallery-narrow
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: dump
      BODY: '{"name":"2-pressed"}'
- extendedWaitUntil:
    visible:
      id: diag-never
    timeout: 20000
    optional: true
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: dump
      BODY: '{"name":"3-pressed-20s"}'
- extendedWaitUntil:
    visible:
      id: gal-colors
    timeout: 60000
- takeScreenshot: 04w-v46-gallery-wide-narrow
- scroll
- scroll
- scroll
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: dump
      BODY: '{"name":"4-scrolled"}'
- takeScreenshot: 04w-v46-gallery-wide-narrow-scrolled
- extendedWaitUntil:
    visible:
      id: diag-never
    timeout: 30000
    optional: true
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: dump
      BODY: '{"name":"5-scrolled-30s"}'
- takeScreenshot: 04w-v46-gallery-wide-narrow-scrolled-30s
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: screen
- stopApp
- launchApp
- extendedWaitUntil:
    notVisible:
      id: launch-curtain
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: tab-profile
    timeout: 15000
