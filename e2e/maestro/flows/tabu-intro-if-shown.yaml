# Sesli Tabu's short intro shows once per device, on its first two-table Tabu (docs/SPEC_V3.md
# §19.2). In p0.yaml that is 04; a shard (shard-*.yaml) whose first two-table Tabu is a later flow
# sees it there and closes it here. Elsewhere this waits a few seconds and does nothing.
appId: app.kabuk.mobile
---
- extendedWaitUntil:
    visible:
      id: first-game-intro
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: first-game-intro
    commands:
      - tapOn:
          id: intro-done
