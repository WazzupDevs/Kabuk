# The profile steps after the code (docs/SPEC_V4.md §4.C, the v45 report §1): the display name
# (4/7), the birth date (5/7) and the gender (6/7; docs/SPEC_V3.md §23.D), from env NAME, DAY,
# MONTH, YEAR. "Kadın", so the game flow's flows keep the anonymous or profiled choice. The gender
# step sends the profile.
appId: app.kabuk.mobile
---
- tapOn:
    id: signup-name
- eraseText
- inputText: ${NAME}
- hideKeyboard
- tapOn:
    id: name-continue
- extendedWaitUntil:
    visible:
      id: signup-birth-step
    timeout: 10000
# Android's back goes to the name step, the name still there; its button works again.
- pressKey: back
- extendedWaitUntil:
    visible:
      id: signup-name-step
    timeout: 10000
- tapOn:
    id: name-continue
- extendedWaitUntil:
    visible:
      id: signup-birth-step
    timeout: 10000
- tapOn:
    id: birth-day
- inputText: ${DAY}
- tapOn:
    id: birth-month
- inputText: ${MONTH}
- tapOn:
    id: birth-year
- inputText: ${YEAR}
- hideKeyboard
- tapOn:
    id: birth-continue
- extendedWaitUntil:
    visible:
      id: signup-gender-step
    timeout: 10000
- tapOn:
    id: gender-female
- tapOn:
    id: gender-continue
