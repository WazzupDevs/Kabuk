# The sign-up profile step: display name, birth date (env NAME, DAY, MONTH, YEAR) and the gender
# (docs/SPEC_V3.md §23.D). "Kadın", so the game flow's flows keep the anonymous or profiled choice.
appId: app.kabuk.mobile
---
- tapOn:
    id: signup-name
- eraseText
- inputText: ${NAME}
- tapOn:
    id: birth-day
- inputText: ${DAY}
- tapOn:
    id: birth-month
- inputText: ${MONTH}
- tapOn:
    id: birth-year
- inputText: ${YEAR}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: gender-female
    direction: DOWN
- tapOn:
    id: gender-female
- scrollUntilVisible:
    element:
      id: signup-continue
    direction: DOWN
- tapOn:
    id: signup-continue
