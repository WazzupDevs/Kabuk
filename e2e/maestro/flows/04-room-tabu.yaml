# V7 and T1–T3 with the v3 room flow (docs/SPEC_V3.md §5) and the Faz 3 venue (§23.C): a new
# alias, the spots (a table at another spot, "Bu noktadayım", then the same spot), "Masanı lobiye
# aç" with an intent and a game tag, the table card "Lobide açık" and its "Masaya git" to the
# waiting room, the bot table asks to join, accept, chat, the bot proposes Sesli Tabu and this phone
# accepts, one voice Tabu turn, "Oyunu bitir" back to chat, and a proposal the bot does not accept.
appId: app.kabuk.mobile
---
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: login
# The bot table checks in at another spot and opens a room there: the lobby groups it under its
# spot with "Bu noktadayım" instead of a request (docs/SPEC_V3.md §4.3).
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: checkin
      BODY: '{"spot":"kutuphane"}'
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: create-room
- tapOn:
    id: tab-venue
# "Adı değiştir": three per check-in (§5.6).
- tapOn:
    id: reroll-alias
- extendedWaitUntil:
    visible: 2 hakkın kaldı
    timeout: 15000
- takeScreenshot: 11b-alias-rerolled
# The table card (alias, spot, "Masanı lobiye aç", "Masanla oyna") is above the lobby: scroll to it.
- scrollUntilVisible:
    element:
      id: spot-here
    centerElement: true
    timeout: 20000
- assertVisible: Kütüphane
# "Katıl" by id: the open table's card has "Bu masadayım" too when its owner can have members.
- assertNotVisible:
    id: request-join
- takeScreenshot: 12b-lobby-other-spot
- tapOn:
    id: spot-here
- scrollUntilVisible:
    element:
      id: request-join
    timeout: 15000
- takeScreenshot: 12c-lobby-same-spot
# The bot leaves the lobby; this phone opens its table to it at the same spot and the bot asks to
# join.
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: end-room
- extendedWaitUntil:
    notVisible:
      id: request-join
    timeout: 20000
- scrollUntilVisible:
    element:
      text: 'Noktan: Kütüphane'
    direction: UP
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: lobby-open
    timeout: 10000
- tapOn:
    id: lobby-open
- extendedWaitUntil:
    visible:
      id: intent-none
    timeout: 10000
# No game is chosen: an optional intent label, an optional game tag that only the lobby shows, and
# anonymous (default) or with the profile.
- tapOn:
    id: intent-game
- tapOn:
    id: game-tag-tabu
# The tag is chosen before the sheet scrolls on: further down it is off the top of a 320 × 640
# screen.
- assertVisible:
    id: game-tag-tabu
    selected: true
- takeScreenshot: 13-new-room
# The choices push the button below the fold of the sheet.
- scrollUntilVisible:
    element:
      id: lobby-confirm
    timeout: 10000
- assertVisible:
    id: participation-anonymous
# "Profilimle" needs a profile photo (docs/SPEC_V3.md §22.G); this phone skipped it at sign-up, so
# the choice says why and opens the photo sheet in place.
- extendedWaitUntil:
    visible: Profilinle görünmek için profil fotoğrafı gerekiyor.
    timeout: 10000
- takeScreenshot: 13b-new-room-bottom
- tapOn:
    id: photo-add
- extendedWaitUntil:
    visible:
      id: photo-from-library
    timeout: 10000
- takeScreenshot: 13c-new-room-photo-sheet
- tapOn:
    id: photo-cancel
# The sheet comes back with the choices made: up to the tag, still chosen, then down to the button.
- scrollUntilVisible:
    element:
      id: game-tag-tabu
    direction: UP
    timeout: 10000
- assertVisible:
    id: game-tag-tabu
    selected: true
- scrollUntilVisible:
    element:
      id: lobby-confirm
    timeout: 10000
- tapOn:
    id: lobby-confirm
# In the lobby: the table card says so, and nothing opens the room by itself (§23.C). The venue
# was not at its top when the sheet opened; it goes back to the card by itself, no scrolling here.
- extendedWaitUntil:
    visible: Lobide açık
    timeout: 15000
- assertVisible:
    id: withdraw-table
- assertNotVisible:
    id: lobby-open
- takeScreenshot: 13d-venue-in-lobby
# "Masaya git": today's waiting room, where the table can play on its own until another table joins.
- scrollUntilVisible:
    element:
      id: go-to-table
    centerElement: true
    timeout: 10000
- tapOn:
    id: go-to-table
- extendedWaitUntil:
    visible:
      id: solo-tabu
    timeout: 15000
- takeScreenshot: 14-room-waiting
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: request-join
      BODY: '{"profiled":true}'
# The request opens over whatever screen is up (§23.C), here the waiting room. The bot asked with
# its profile: the card shows its name and age (§23.E), read while the request waits.
- extendedWaitUntil:
    visible: Katılma isteği
    timeout: 20000
- assertVisible: Geç
- extendedWaitUntil:
    visible: 'Bot Masa, \d+'
    timeout: 10000
- takeScreenshot: 15-join-request
- tapOn:
    id: join-accept
# The room starts as a chat: "Oyun öner", no game running.
- extendedWaitUntil:
    visible:
      id: propose-tabu
    timeout: 15000
- takeScreenshot: 16-room-two-tables
# The bot table proposes Sesli Tabu; the game starts when this table accepts.
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: propose-game
      BODY: '{"concept":"tabu"}'
- extendedWaitUntil:
    visible:
      id: proposal-accept
    timeout: 20000
- takeScreenshot: 16b-proposal
- tapOn:
    id: proposal-accept
# The device's first two-table game: Sesli Tabu's short intro, once (docs/SPEC_V3.md §19.2).
- extendedWaitUntil:
    visible:
      id: first-game-intro
    timeout: 20000
- takeScreenshot: 16c-first-game-intro
- tapOn:
    id: intro-done
# Turn 1 opens ready (§19.1): this phone describes and starts it with Başla.
- extendedWaitUntil:
    visible:
      id: turn-start
    timeout: 15000
- takeScreenshot: 16d-turn-ready
- tapOn:
    id: turn-start
# Turn 1: the owner table (this phone) describes; its card starts covered.
- extendedWaitUntil:
    visible: Kartı görmek için dokun
    timeout: 20000
- takeScreenshot: 17-card-covered
- tapOn: Kartı görmek için dokun
- extendedWaitUntil:
    visible:
      id: tabu-card
    timeout: 20000
- takeScreenshot: 18-card-open
# The game is full screen; the room chat opens from its button as a panel and closes again.
- tapOn:
    id: game-chat
- extendedWaitUntil:
    visible:
      id: game-chat-panel
    timeout: 10000
- takeScreenshot: 18b-game-chat
- tapOn:
    id: chat-back
# CLAUDE.md → Ekran davranışı: the clock, the card and the buttons on screen together, no
# scrolling (StageFit).
- extendedWaitUntil:
    visible:
      id: tabu-pass
    timeout: 10000
- assertVisible:
    id: game-clock
- assertVisible: 3 hak
- tapOn:
    id: tabu-pass
- extendedWaitUntil:
    visible: 2 hak
    timeout: 10000
# The judging table (the bot) says Doğru.
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: mark
      BODY: '{"result":"correct"}'
- takeScreenshot: 19-after-marks
# Turn 2 without waiting 60 s: the bot table's turn, this phone judges.
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: expire-turn
# Turn 2 opens ready: the last turn's summary and the countdown here; the bot table describes and
# starts it.
- extendedWaitUntil:
    visible:
      id: turn-countdown
    timeout: 20000
- takeScreenshot: 19b-turn-ready-waiting
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: begin-turn
# The turn counter on top and the judge's buttons at the bottom, together (no scrolling).
- extendedWaitUntil:
    visible:
      text: .*Tur 2/6
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: tabu-taboo
    timeout: 20000
- takeScreenshot: 20-judge
- tapOn:
    id: tabu-correct
# "Oyunu bitir": back to the chat, the room stays.
- scrollUntilVisible:
    element:
      id: end-game
    centerElement: true
    timeout: 10000
- tapOn:
    id: end-game
- extendedWaitUntil:
    visible:
      id: end-game-confirm
    timeout: 10000
- takeScreenshot: 20a-end-confirm
# "Oyunu bitir" asks first (canvas: Aşama 6 · Oyunlar).
- tapOn:
    id: end-game-confirm
# The screen is still scrolled down to the button; the last game is at the top.
- scrollUntilVisible:
    element:
      id: last-game
    direction: UP
    timeout: 15000
# The strip and the tabs scroll with the page (docs/SPEC_V3.md §23.F): the game list may sit below
# the fold.
- scrollUntilVisible:
    element:
      id: propose-sohbet
    centerElement: true
    timeout: 10000
- takeScreenshot: 20b-back-to-chat
# This table proposes Sohbet kartları and the bot declines: "Öneri kabul edilmedi" at once (S7).
- tapOn:
    id: propose-sohbet
- extendedWaitUntil:
    visible: Sohbet kartları önerdin.*
    timeout: 10000
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: answer-game
      BODY: '{"accept":false}'
- extendedWaitUntil:
    visible:
      id: proposal-not-accepted
    timeout: 15000
- takeScreenshot: 20c-not-accepted
# docs/SPEC_V3.md §21: the bot table writes in the room chat; this table reacts with ❤️ (the second
# of the six) and the bot sees it. Last in the flow: until now the room has no messages.
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: chat-send
      BODY: '{"body":"Selam masa"}'
# On Oyun Seç the message puts a dot on Masa Sohbeti (§23.F); the tabs are at the top of the page.
- scrollUntilVisible:
    element:
      id: tab-chat
    direction: UP
    timeout: 15000
- takeScreenshot: 20c2-unread-chat
- tapOn:
    id: tab-chat
# Masa Sohbeti opens at the newest message.
- extendedWaitUntil:
    visible: Selam masa
    timeout: 15000
- longPressOn: Selam masa
- extendedWaitUntil:
    visible:
      id: reaction-bar
    timeout: 10000
- tapOn:
    id: react-1
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: chat-reactions
      EXPECT_REACTION: ❤️
- takeScreenshot: 20d-room-reaction
