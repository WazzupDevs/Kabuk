# T6, F1, F3 (docs/SPEC_V4.md §4.E, K-56): the owner ends the table; on Masa bitti "Arkadaş ekle"
# from both people makes friends at once, with "Mesaj"; then a DM both ways.
appId: app.kabuk.mobile
---
# The pair must have played at least 3 minutes for a record (and "Arkadaş ekle").
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: backdate-encounter
# "Masayı bitir" from the owner's bar asks first (v46 data-msheet "bitir").
- tapOn:
    id: table-end-open
- extendedWaitUntil:
    visible:
      id: table-end-confirm
    timeout: 10000
- tapOn:
    id: table-end-confirm
# The table's end at once (docs/SPEC_V3.md §23.G), one row for the bot's phone.
- extendedWaitUntil:
    visible:
      id: table-end-add-.*
    timeout: 20000
- takeScreenshot: 21-table-end
- tapOn:
    id: table-end-add-.*
# One press shows only "Sen bastın" on this phone; the bot sees nothing (rule 5).
- extendedWaitUntil:
    visible:
      id: table-end-pressed-.*
    timeout: 10000
- takeScreenshot: 22-table-end-pressed
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: add-friend
# Both pressed: friends, and "Mesajlaş" on the row.
- extendedWaitUntil:
    visible:
      id: table-end-message-.*
    timeout: 20000
- assertVisible: Arkadaş oldunuz
- takeScreenshot: 23-table-end-friends
- runFlow:
    file: table-end-close.yaml
# Mesajlar (docs/SPEC_V3.md §18.3): the new friend with "Henüz mesaj yok".
- tapOn:
    id: tab-messages
- extendedWaitUntil:
    visible: Henüz mesaj yok
    timeout: 20000
- takeScreenshot: 25-messages
# İstekler (docs/SPEC_V4.md §4.C, v45): the two became friends at the table's end, no request waits.
- tapOn:
    id: messages-tab-requests
- extendedWaitUntil:
    visible: Bekleyen istek yok
    timeout: 15000
- takeScreenshot: 25a-requests-empty
- tapOn:
    id: messages-tab-chats
- extendedWaitUntil:
    visible:
      id: inbox-Bot Masa
    timeout: 15000
- tapOn:
    id: inbox-Bot Masa
- extendedWaitUntil:
    visible: Henüz mesaj yok. İlk mesajı sen yaz.
    timeout: 15000
- takeScreenshot: 26-dm-empty
- tapOn:
    id: dm-input
- inputText: Merhaba bot
# The composer sits under the keyboard on this screen (listed in the PR as a visual bug); the
# screenshot keeps it visible, hideKeyboard lets the flow reach the send button.
- takeScreenshot: 26b-dm-keyboard
- hideKeyboard
- tapOn:
    id: dm-send
- extendedWaitUntil:
    visible: Merhaba bot
    timeout: 10000
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: dm-last
      EXPECT_DM: Merhaba bot
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: dm-send
      BODY: '{"body":"Selam cihaz"}'
- extendedWaitUntil:
    visible: Selam cihaz
    timeout: 20000
- takeScreenshot: 27-dm
- hideKeyboard
# No tab bar in a DM: back to Mesajlar first (optional: hideKeyboard may already have gone back
# when the keyboard was closed).
- tapOn:
    id: chat-back
    optional: true
- extendedWaitUntil:
    visible:
      id: tab-messages
    timeout: 10000
