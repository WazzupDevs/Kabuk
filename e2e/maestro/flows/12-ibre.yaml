# İbre (docs/SPEC_V3.md §20.5): round 1 this phone describes: Başla, holds the target, drags the
# needle, locks it; the bot says "Sağında" and the reveal shows. Round 2 the bot describes and this
# phone picks a side. The bot then ends the game on the clock and the result shows. The clocks are
# held (ibre-hold) wherever the emulator's slow screen reads would race them.
appId: app.kabuk.mobile
appId: app.kabuk.mobile
---
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: leave
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: checkin
      BODY: '{"spot":"kutuphane","headcount":2}'
- tapOn:
    id: tab-venue
# "Lobiye aç", the bot asks to join, "Kabul" on the venue, the table card's head (§23.C).
- runFlow:
    file: open-lobby-accept.yaml
# The game list starts under the strip and the tabs: İbre, the fifth, is below the fold.
- extendedWaitUntil:
    visible:
      id: tab-games
    timeout: 15000
- scrollUntilVisible:
    element:
      id: propose-ibre
    centerElement: true
    timeout: 15000
- tapOn:
    id: propose-ibre
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: answer-game
# Round 1: this phone's table describes.
- extendedWaitUntil:
    visible:
      id: turn-start
    timeout: 20000
- takeScreenshot: 54-ibre-ready
- tapOn:
    id: turn-start
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: ibre-hold
- extendedWaitUntil:
    visible:
      id: ibre-hold
    timeout: 15000
- longPressOn:
    id: ibre-hold
# The two dials size to the screen: both, the − / + row and "İbreyi onayla" are on screen with
# the clock, no scrolling.
- extendedWaitUntil:
    visible:
      id: ibre-drag
    timeout: 15000
- swipe:
    from:
      id: ibre-drag
    direction: RIGHT
    duration: 600
- assertVisible:
    id: ibre-plus
- tapOn:
    id: ibre-plus
- takeScreenshot: 55-ibre-needle
- assertVisible:
    id: ibre-lock
- tapOn:
    id: ibre-lock
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: ibre-side
      BODY: '{"side":"right"}'
# The reveal over round 2's ready state.
- extendedWaitUntil:
    visible:
      id: ibre-reveal
    timeout: 20000
- takeScreenshot: 56-ibre-reveal
# Round 2: the bot table describes; this phone picks a side.
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: ibre-begin
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: ibre-lock
      BODY: '{"value":30}'
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: ibre-hold
- extendedWaitUntil:
    visible:
      id: ibre-side-phase
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: ibre-side-left
    timeout: 15000
- takeScreenshot: 57-ibre-side
- tapOn:
    id: ibre-side-left
- extendedWaitUntil:
    visible:
      id: ibre-reveal
    timeout: 20000
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: ibre-end
# Back on Oyun Seç: the last round's dial, then the game's result under it, below the fold.
- extendedWaitUntil:
    visible:
      id: tab-games
    timeout: 20000
- scrollUntilVisible:
    element:
      id: last-game
    centerElement: true
    timeout: 10000
- takeScreenshot: 58-ibre-result
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: end-room
- runFlow:
    file: table-end-close.yaml
