# The flows with the bot's table play at Kütüphane, where the bot checks in; only tables at the
# same spot sit together (docs/SPEC_V3.md §4.3). 02 checks this phone in at Kantin; a shard without
# 04 (shard-*.yaml) moves it to Kütüphane here with the card's "Değiştir" and "Bu noktadayım".
appId: app.kabuk.mobile
---
- tapOn:
    id: tab-venue
- scrollUntilVisible:
    element:
      id: change-spot
    centerElement: true
    timeout: 15000
- tapOn:
    id: change-spot
- extendedWaitUntil:
    visible:
      id: spot-kutuphane
    timeout: 10000
- tapOn:
    id: spot-kutuphane
- tapOn: Bu noktadayım
- extendedWaitUntil:
    visible: 'Noktan: Kütüphane'
    timeout: 15000
