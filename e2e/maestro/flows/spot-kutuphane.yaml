# The game flows play at Kütüphane, where the bot checks in; only tables at the same spot play
# together (docs/SPEC_V3.md §4.3). 02 checks this phone in at Kantin and 04 moves it to Kütüphane
# with "Bu noktadayım" under the bot's room. A shard without 04 (shard-*.yaml) makes the same move
# here, without 04's checks and screenshots.
appId: app.kabuk.mobile
---
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: checkin
      BODY: '{"spot":"kutuphane"}'
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: create-room
- tapOn:
    id: tab-venue
- scrollUntilVisible:
    element:
      id: spot-here
    timeout: 20000
- tapOn:
    id: spot-here
- scrollUntilVisible:
    element:
      id: request-join
    timeout: 15000
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: end-room
- extendedWaitUntil:
    notVisible:
      id: request-join
    timeout: 20000
- scrollUntilVisible:
    element:
      text: 'Noktan: Kütüphane'
    direction: UP
    timeout: 10000
