# V4 (and V3's refusal): pick the venue by hand, check in from outside the boundary (refused), then
# inside at a spot. Keşfet starts with two venues (list and map), then shows the pilot's single
# venue card once the bot closes the other venues (docs/SPEC_V3.md §4.4).
appId: app.kabuk.mobile
---
- scrollUntilVisible:
    element:
      text: E2E Kafe
    timeout: 30000
- takeScreenshot: 05-explore-list
# v44's list (docs/SPEC_V4.md §4.C): kind, search, then city and district (K-38). Two cities have
# active venues here (the E2E venues in İstanbul, the campus in Sakarya): the city button shows and
# İstanbul, with the most venues, comes first.
- tapOn:
    id: explore-kind-campus
- extendedWaitUntil:
    visible: E2E Kafe
    timeout: 10000
- assertNotVisible: E2E Kafe İki
- takeScreenshot: 05d-explore-kind
- tapOn:
    id: explore-kind-all
- tapOn:
    id: explore-search
- inputText: iki
- extendedWaitUntil:
    visible: E2E Kafe İki
    timeout: 10000
- assertNotVisible: E2E Kafe
- takeScreenshot: 05e-explore-search
- eraseText: 10
- hideKeyboard
- tapOn:
    id: explore-place
- extendedWaitUntil:
    visible: Şehir ve semt
    timeout: 10000
- tapOn:
    id: place-city-Sakarya
- takeScreenshot: 05f-explore-place-sheet
- tapOn:
    id: place-show
- extendedWaitUntil:
    visible: Sakarya Üniversitesi Esentepe Kampüsü
    timeout: 10000
- assertVisible: 'Sakarya · Tüm semtler'
- assertNotVisible: E2E Kafe
- takeScreenshot: 05g-explore-sakarya
# Back to İstanbul for the rest of the flow (the choice stays on the phone).
- tapOn:
    id: explore-place
- tapOn:
    id: place-city-İstanbul
- tapOn:
    id: place-show
# The map: GL layers under the header (the header and the switch stay on top), opening on the
# venues. Pins are GL, not views, so the screenshot is the check; it waits until the map has drawn
# its style, glyphs and venue layers (`explore-map-ready`).
- tapOn: Harita
- extendedWaitUntil:
    visible:
      id: explore-map-ready
    timeout: 30000
- assertVisible: Keşfet
- assertVisible: Liste
- takeScreenshot: 05b-explore-map
# Symbol layers (the kind glyph inside each pin, cluster counts) load their images and glyphs after
# the first full render: a second screenshot a few seconds later shows them.
- evalScript: ${const end = Date.now() + 4000; while (Date.now() < end) {} }
- takeScreenshot: 05c-explore-map-settled
# From the map to another tab: the bar there blurs that tab's screen, nothing of the map, and the
# screen ends without a black strip (0.6.0: the map left the app's window translucent and a black
# strip stayed over the navigation bar on every later screen; the bot reads the screen's pixels).
# Back on Keşfet the map is still open.
- tapOn:
    id: tab-activities
- extendedWaitUntil:
    visible:
      id: activities-no-events
    timeout: 10000
- takeScreenshot: 05h-explore-map-left
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: bottom-strip
- tapOn:
    id: tab-explore
- extendedWaitUntil:
    visible:
      id: explore-map-ready
    timeout: 30000
- tapOn: Liste
- scrollUntilVisible:
    element:
      text: E2E Kafe
    timeout: 30000
- tapOn: E2E Kafe
- extendedWaitUntil:
    visible: Buraya giriş yap
    timeout: 10000
- takeScreenshot: 06-venue-detail
- back
# One active venue: the single venue card, its events and "Yeni mekanlar yakında"; no list/map.
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: single-venue
- launchApp
- extendedWaitUntil:
    visible: Yeni mekanlar yakında.
    timeout: 30000
# The launch curtain (src/features/launch/LaunchCurtain.tsx) mounts before the first screen and
# opens onto it; the flow looks at the screen once it is gone.
- extendedWaitUntil:
    notVisible:
      id: launch-curtain
    timeout: 15000
- assertVisible: E2E Kafe
- assertNotVisible: Liste
- takeScreenshot: 06b-explore-single
- tapOn: Buraya giriş yap
- extendedWaitUntil:
    visible: Konumumu kullan
    timeout: 10000
- tapOn: Konumumun bu amaçla kullanılmasına açık rıza veriyorum.
- takeScreenshot: 07-location-consent
- setLocation:
    latitude: ${OUTSIDE_LAT}
    longitude: ${OUTSIDE_LNG}
- tapOn: Konumumu kullan
- extendedWaitUntil:
    visible: Kampüsün içinde görünmüyorsun. Kampüse girince tekrar dene.
    timeout: 30000
- takeScreenshot: 08-too-far
- setLocation:
    latitude: ${INSIDE_LAT}
    longitude: ${INSIDE_LNG}
- tapOn: Konumumu kullan
# "Neredesin?": the venue's spots. A check-in opens no table and asks no headcount (docs/SPEC_V4.md
# §4.E): Mekan follows with the card that sets up a table ("Masa kur").
- extendedWaitUntil:
    visible: Neredesin\?
    timeout: 30000
- takeScreenshot: 08b-spot
- tapOn:
    id: spot-kantin
- tapOn: Devam
- extendedWaitUntil:
    visible:
      id: table-create-open
    timeout: 15000
- assertVisible: 'Noktan: Kantin'
- takeScreenshot: 11-venue
# The top row (v45: .top): the own photo opens Profil, Mekan's tab brings it back; "Mekandan ayrıl"
# asks first and "Vazgeç" keeps the check-in (Android may write the dialog's buttons in capitals).
- tapOn:
    id: venue-profile
- extendedWaitUntil:
    visible:
      id: profile-friends
    timeout: 10000
- tapOn:
    id: tab-venue
- extendedWaitUntil:
    visible:
      id: venue-leave
    timeout: 10000
- tapOn:
    id: venue-leave
- extendedWaitUntil:
    visible: 'Mekandan ayrılıyor musun\?'
    timeout: 10000
- tapOn: 'vazge[çÇ]'
- extendedWaitUntil:
    notVisible: 'Mekandan ayrılıyor musun\?'
    timeout: 10000
- assertVisible:
    id: table-create-open
