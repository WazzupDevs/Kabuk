# Pick light or dark in Ayarlar → Görünüm (K-54) before the P0 path. Env: SCHEME (light|dark).
appId: app.kabuk.mobile
---
- tapOn:
    id: tab-profile
- tapOn: Ayarlar
- extendedWaitUntil:
    visible:
      id: appearance-system
    timeout: 10000
- tapOn:
    id: appearance-${SCHEME}
- takeScreenshot: 04b-design
# Ayarlar is a sheet over Profil (skall tuvali): Android's back closes it.
- back
- extendedWaitUntil:
    notVisible:
      id: settings
    timeout: 10000
- tapOn:
    id: tab-explore
- extendedWaitUntil:
    visible: Liste
    timeout: 10000
