# F3b (docs/SPEC_V3.md §18.3): ticks and "yazıyor" in a DM. The device writes, the bot reads (the
# tick turns to read), the bot types (the dots show) and answers (the dots go). §21: the device
# reacts to the answer with a long press and replies to it with a swipe; the bot sees both.
appId: app.kabuk.mobile
---
- tapOn:
    id: inbox-Bot Masa
- extendedWaitUntil:
    visible: Selam cihaz
    timeout: 15000
- tapOn:
    id: dm-input
- inputText: Okudun mu?
- hideKeyboard
- tapOn:
    id: dm-send
- extendedWaitUntil:
    visible: Okudun mu\?
    timeout: 10000
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: dm-last
      EXPECT_DM: Okudun mu?
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: dm-read
- extendedWaitUntil:
    visible:
      id: tick-read
    timeout: 15000
- takeScreenshot: 27b-dm-read
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: dm-typing
      BODY: '{"seconds":10}'
- extendedWaitUntil:
    visible:
      id: dm-typing
    timeout: 10000
- takeScreenshot: 27c-dm-typing
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: dm-send
      BODY: '{"body":"Okudum"}'
- extendedWaitUntil:
    visible: Okudum
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: dm-typing
    timeout: 10000
- takeScreenshot: 27d-dm-answer
# §21.2: a long press opens the six reactions; 👍 (the first) shows under the bubble.
- longPressOn: Okudum
- extendedWaitUntil:
    visible:
      id: reaction-bar
    timeout: 10000
- takeScreenshot: 27f-dm-reaction-bar
# CLAUDE.md → Ekran davranışı: a tap outside closes the bar, and so does the back key (the DM
# stays open).
- tapOn: Okudun mu\?
- extendedWaitUntil:
    notVisible:
      id: reaction-bar
    timeout: 5000
- longPressOn: Okudum
- extendedWaitUntil:
    visible:
      id: reaction-bar
    timeout: 10000
- back
- extendedWaitUntil:
    notVisible:
      id: reaction-bar
    timeout: 5000
- assertVisible:
    id: dm-input
- longPressOn: Okudum
- extendedWaitUntil:
    visible:
      id: reaction-bar
    timeout: 10000
- tapOn:
    id: react-0
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: dm-last
      EXPECT_DM: Okudum
      EXPECT_REACTION: 👍
# §21.1: a swipe to the right answers the message; the quote shows over the bar, then in the bubble.
- swipe:
    from:
      text: Okudum
    direction: RIGHT
    duration: 600
- extendedWaitUntil:
    visible:
      id: reply-strip
    timeout: 10000
- takeScreenshot: 27g-dm-reply-strip
- tapOn:
    id: dm-input
- inputText: Harika
- hideKeyboard
- tapOn:
    id: dm-send
- extendedWaitUntil:
    visible: Harika
    timeout: 10000
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: dm-last
      EXPECT_DM: Harika
      EXPECT_REPLY: Okudum
- takeScreenshot: 27h-dm-reply
# A tap on the quote goes to the answered message.
- tapOn:
    id: chat-quote
- assertVisible: Okudum
- tapOn:
    id: chat-back
    optional: true
- extendedWaitUntil:
    visible:
      id: tab-messages
    timeout: 10000
# Aşama 8 · Saha → Mesajlar: "yazıyor…" in the conversation's row too.
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: dm-typing
      BODY: '{"seconds":10}'
- extendedWaitUntil:
    visible:
      id: inbox-typing
    timeout: 10000
- takeScreenshot: 27e-inbox-typing
# The DM opens at its newest message (CLAUDE.md → Ekran davranışı): the reply is on screen without
# scrolling, under its quote.
- tapOn:
    id: inbox-Bot Masa
- extendedWaitUntil:
    visible: Harika
    timeout: 15000
- takeScreenshot: 27i-dm-reopened
- tapOn:
    id: chat-back
    optional: true
- extendedWaitUntil:
    visible:
      id: tab-messages
    timeout: 10000
# Arkadaşlar under Profil (v45: .frs) and the friend's profile (v45: .prof, other): "Seçenekler"
# holds the report; back to Profil.
- tapOn:
    id: tab-profile
- tapOn:
    id: profile-friends
- extendedWaitUntil:
    visible:
      id: friend-Bot Masa
    timeout: 15000
- takeScreenshot: 27j-friends
- tapOn:
    id: friend-Bot Masa
- extendedWaitUntil:
    visible:
      id: profile-more
    timeout: 15000
- assertVisible: 'Bot Masa(, \d+)?'
- takeScreenshot: 27k-friend-profile
- tapOn:
    id: profile-more
- extendedWaitUntil:
    visible:
      id: profile-report
    timeout: 10000
- back
- extendedWaitUntil:
    notVisible:
      id: profile-report
    timeout: 10000
- tapOn:
    id: profile-back
- extendedWaitUntil:
    visible:
      id: friend-Bot Masa
    timeout: 10000
- back
- extendedWaitUntil:
    visible:
      id: tab-profile
    timeout: 10000
