# End-to-end: the FIELD_TEST.md P0 path on an Android emulator against the local stack, with a bot
# as the second table (scripts/e2e/bot-table.ts). One job builds the APK. The path is split in four
# shards (e2e/maestro/shard-<n>.yaml), each run in light and dark: eight jobs that start with the
# build job, set up the local stack and boot their emulator while it builds, then fetch the APK,
# pick the design in Ayarlar → Tasarım (test) and run their shard. Nightly and by hand, the four
# shards run once more in light at the largest text size (font_scale 1.3): twelve jobs.
name: e2e

on:
  # On a PR only with the `e2e` label: when it is added, and on every push while it is on.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  # Nightly on main, 04:23 İstanbul. Also the run that fills the Gradle cache (only the default
  # branch writes it; PR runs read it).
  schedule:
    - cron: '23 1 * * *'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The emulator reaches the runner's local stack at 10.0.2.2. The publishable key is the fixed
  # key of every local stack; the e2e job checks it after `supabase start`.
  E2E_SUPABASE_URL: http://10.0.2.2:54321
  E2E_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH

jobs:
  # One release APK for every run: light or dark is picked at runtime in Ayarlar → Tasarım (test).
  build:
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'e2e') &&
       (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Gradle's dependency and build caches (~/.gradle): written by main's nightly run, read by the
      # rest; --build-cache below lets unchanged tasks come from it.
      - uses: gradle/actions/setup-gradle@v4
      - name: Prebuild, local-stack settings (cleartext HTTP, no OTA)
        run: |
          (cd apps/mobile && npx expo prebuild --platform android --no-install --clean)
          bash scripts/e2e/patch-android.sh
      - name: Release APK, x86_64 only
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ env.E2E_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.E2E_PUBLISHABLE_KEY }}
          # Shows Ayarlar → Tasarım (test) in this APK (src/theme/ThemeProvider.tsx).
          EXPO_PUBLIC_APP_ENV: e2e
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          NODE_ENV: production
        run: |
          cd apps/mobile/android
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --build-cache
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 3

  # Not `needs: build`: the shards start with it and wait for its APK only after the emulator has
  # booted (scripts/e2e/run-on-emulator.sh), so the setup and boot run while Gradle builds. The
  # shard files and their order are checked in scripts/e2e/shards.test.ts.
  e2e:
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'e2e') &&
       (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    # actions: read for this run's e2e-apk artifact (run-on-emulator.sh).
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scheme: [light, dark]
        shard: [1, 2, 3, 4]
        # Android's text size (Settings → Display → Font size): the default, and nightly and by hand
        # also the largest the app is checked at, 1.3 (CLAUDE.md → "Ekran davranışı"), in light only.
        # A PR runs the default size.
        font: ${{ fromJSON(github.event_name == 'pull_request' && '["1.3"]' || '["1", "1.3"]') }} # TEMP: PR runs only the large pass
        exclude:
          - scheme: dark
            font: '1.3'
    env:
      SCHEME: ${{ matrix.scheme }}
      FONT_SCALE: ${{ matrix.font }}
      FLOW: e2e/maestro/shard-${{ matrix.shard }}.yaml
      # light-1 … dark-4 at the default size, large-1 … large-4 at 1.3.
      OUT: ${{ github.workspace }}/e2e-out/${{ matrix.font == '1' && format('{0}-{1}', matrix.scheme, matrix.shard) || format('large-{0}', matrix.shard) }}
      APK: ${{ github.workspace }}/apk/app-release.apk
    steps:
      - uses: actions/checkout@v4
      # The runner's free disk varies; the emulator's userdata partition needs ~7.5 GB next to the
      # local Supabase images. Tools this job never uses go first (the APK is built in `build`, so
      # the NDK too).
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk
          df -h /
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Local Supabase
        run: |
          mkdir -p "$OUT"
          cp supabase/.env.example supabase/.env
          pnpm supabase start -x studio,imgproxy,mailpit,logflare,vector,supavisor,postgres-meta
          pnpm --filter scripts apply-local-secrets
          key=$(pnpm -s supabase status -o env | sed -n 's/^PUBLISHABLE_KEY="\(.*\)"$/\1/p')
          test "$key" = "$E2E_PUBLISHABLE_KEY" || { echo "local publishable key changed: $key"; exit 1; }
      # The local stack signs photo URLs on its internal address (http://kong:8000), which the
      # emulator cannot reach; LOCAL_DEVICE_URL puts the emulator's address in its place
      # (supabase/functions/_shared/pure/devProject.ts → deviceReachableUrl; local stack only).
      - name: Edge Functions, E2E venue, bot table
        run: |
          echo "LOCAL_DEVICE_URL=$E2E_SUPABASE_URL" > "$RUNNER_TEMP/functions.env"
          nohup pnpm supabase functions serve --env-file "$RUNNER_TEMP/functions.env" > "$OUT/functions.log" 2>&1 &
          timeout 180 bash -c 'until curl -sf -X POST http://127.0.0.1:54321/functions/v1/ping -H "apikey: $E2E_PUBLISHABLE_KEY" -H "content-type: application/json" -d "{}" > /dev/null; do sleep 2; done'
          node --experimental-strip-types scripts/e2e/bot-table.ts setup > "$OUT/setup.json"
          node -e 'const s = require(process.argv[1]);
            console.log(`INSIDE_LAT=${s.inside.lat}\nINSIDE_LNG=${s.inside.lng}\nOUTSIDE_LAT=${s.outside.lat}\nOUTSIDE_LNG=${s.outside.lng}`)' \
            "$OUT/setup.json" >> "$GITHUB_ENV"
          nohup node --experimental-strip-types scripts/e2e/bot-table.ts serve > "$OUT/bot.log" 2>&1 &
          # 13-teams: the second bot table, another account on its own port.
          BOT_PORT=8788 BOT_PHONE=+905550000004 BOT_NAME="Bot Üç" \
            nohup node --experimental-strip-types scripts/e2e/bot-table.ts serve > "$OUT/bot2.log" 2>&1 &
      - name: Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | MAESTRO_VERSION=2.10.0 bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version | tee "$OUT/maestro-version.txt"
      - name: Emulator, APK and the shard's flows
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/e2e/run-on-emulator.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-run-${{ matrix.font == '1' && format('{0}-{1}', matrix.scheme, matrix.shard) || format('large-{0}', matrix.shard) }}
          path: ${{ env.OUT }}
          retention-days: 14

  # Screenshots and logs (no video) on an e2e-screenshots branch, for readers without access to
  # artifact storage: an orphan branch with a single commit, force-pushed by every run, so binaries
  # never pile up in history. A PR run writes its own branch (e2e-screenshots-pr-<number>), so runs of
  # two PRs do not overwrite each other; main, nightly and manual runs write e2e-screenshots. (Git
  # cannot hold both e2e-screenshots and e2e-screenshots/pr-<number>, hence the dash.) Each shard's
  # run is in its own folder (light-1 … dark-4, and large-1 … large-4 at the largest text size);
  # light/takeScreenshot and dark/takeScreenshot hold the takeScreenshot images of the scheme's four
  # shards together, for `pnpm store:screenshots` (large/takeScreenshot those of the large pass).
  publish-screenshots:
    if: ${{ always() && needs.e2e.result != 'skipped' }}
    needs: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-run-*
          path: out
      - name: Push to e2e-screenshots
        env:
          BRANCH: ${{ github.event_name == 'pull_request' && format('e2e-screenshots-pr-{0}', github.event.pull_request.number) || 'e2e-screenshots' }}
        run: |
          mkdir site
          for dir in out/*; do
            run=${dir#out/e2e-run-}
            mkdir -p "site/$run" "site/${run%-*}/takeScreenshot"
            (cd "$dir" && find . -type f ! -name '*.webm' ! -name 'logcat.txt' -exec cp --parents {} "../../site/$run/" \;)
            tail -n 3000 "$dir/logcat.txt" > "site/$run/logcat-tail.txt" 2>/dev/null || true
            find "$dir" -path '*/takeScreenshot/*.png' -exec cp {} "site/${run%-*}/takeScreenshot/" \;
          done
          cd site
          git init -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q --allow-empty -m "E2E screenshots, run ${{ github.run_id }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$BRANCH"
