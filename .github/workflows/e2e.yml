# End-to-end: the FIELD_TEST.md P0 path on an Android emulator against the local stack, with a bot
# as the second table (scripts/e2e/bot-table.ts). One job builds the APK. The path is split in four
# shards (e2e/maestro/shard-<n>.yaml), each run in light and dark: eight jobs that start with the
# build job, set up the local stack and boot their emulator while it builds, then fetch the APK,
# pick the design in Ayarlar → Tasarım (test) and run their shard. Nightly and by hand, the four
# shards run once more in light at the largest text size (font_scale 1.3): twelve jobs. On a PR the
# `e2e-large` label does the same: added, it runs the build and the four large jobs alone, after
# the run still going (the eight others pass first); while it is on, every push runs all twelve.
#
# A shard whose flows fail because Maestro's driver on the phone crashed or could not be reached,
# or because the Edge Functions server stopped while they ran, runs once more on a fresh phone
# (scripts/e2e/retry.ts); a failing step alone never does. The job summary names every retry and
# its reason. The server is started again when it stops on its own, at most twice in the job, as
# in ci.yml (scripts/ci/functions-serve.sh); every stop is in the job summary and a warning.
#
# Minutes (CLAUDE.md → Uçtan uca): a PR's new push replaces its run that is still going; a PR that
# changes only docs and tests has no run; the nightly run is skipped while main has not moved
# since the last nightly run that passed.
name: e2e

on:
  # On a PR only with the `e2e` or `e2e-large` label: when one is added, and on every push while
  # one is on.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    # Only docs and tests (unit and integration): nothing new for the app, no run. The E2E flows and
    # the bot (e2e/, scripts/e2e/*.ts) are not in the list, nor supabase/tests/ beyond its *.test.ts:
    # the bot takes the E2E venue's geometry from supabase/tests/fixtures/venues.ts (paths-ignore
    # cannot list exceptions).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/*.test.ts'
  workflow_dispatch:
  # Nightly on main, 04:23 İstanbul. Also the run that fills the Gradle cache (only the default
  # branch writes it; PR runs read it).
  schedule:
    - cron: '23 1 * * *'

# A PR's new push (or the e2e label added again) replaces its run that is still going, as in
# ci.yml. Adding e2e-large never cancels: its four large jobs wait until the run still going (the
# eight) has finished, then run; a new push still replaces both. Another label checks nothing new:
# it gets a group of its own, so it never cancels the run.
concurrency:
  group: >-
    e2e-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'e2e'
    && github.event.label.name != 'e2e-large' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event.action != 'labeled' || github.event.label.name != 'e2e-large' }}

permissions:
  contents: read

env:
  # The emulator reaches the runner's local stack at 10.0.2.2. The publishable key is the fixed
  # key of every local stack; the e2e job checks it after `supabase start`.
  E2E_SUPABASE_URL: http://10.0.2.2:54321
  E2E_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH

jobs:
  # Nightly only: nothing new to check when main has not moved since the last nightly run that
  # passed (a night that failed runs again the next night). PR and manual runs skip this job and
  # do not wait for it; if it fails, the run goes ahead.
  changed:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/e2e.yml/runs?event=schedule&branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "main (${GITHUB_SHA::7}) son başarılı gece koşusundan beri değişmedi: atlandı." | tee -a "$GITHUB_STEP_SUMMARY"
            echo run=false >> "$GITHUB_OUTPUT"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi

  # One release APK for every run: light or dark is picked at runtime in Ayarlar → Tasarım (test).
  # On a PR: the e2e or e2e-large label just added, or a push while either is on.
  build:
    needs: changed
    if: >-
      needs.changed.outputs.run != 'false' && !cancelled() &&
      (github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' &&
       (github.event.label.name == 'e2e' || github.event.label.name == 'e2e-large')) ||
      (github.event.action != 'labeled' &&
       (contains(github.event.pull_request.labels.*.name, 'e2e') ||
        contains(github.event.pull_request.labels.*.name, 'e2e-large'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Gradle's dependency and build caches (~/.gradle): written by main's nightly run, read by the
      # rest; --build-cache below lets unchanged tasks come from it.
      - uses: gradle/actions/setup-gradle@v4
      # The NDK version React Native pins is not on the runner image, so Gradle downloaded it in every
      # build, without retrying; on 16 Oct that download broke ("Archive is not a ZIP archive"). It
      # is installed here first, with retries, at the version Gradle asks for.
      - name: NDK (with retries)
        run: |
          ndk=$(sed -n 's/^ndkVersion = "\(.*\)"$/\1/p' node_modules/react-native/gradle/libs.versions.toml)
          test -n "$ndk" || { echo "ndkVersion not found in react-native's libs.versions.toml"; exit 1; }
          bash scripts/e2e/sdk-install.sh "ndk;$ndk"
      - name: Prebuild, local-stack settings (cleartext HTTP, no OTA)
        run: |
          (cd apps/mobile && npx expo prebuild --platform android --no-install --clean)
          bash scripts/e2e/patch-android.sh
      - name: Release APK, x86_64 only
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ env.E2E_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.E2E_PUBLISHABLE_KEY }}
          # Shows Ayarlar → Tasarım (test) in this APK (src/theme/ThemeProvider.tsx).
          EXPO_PUBLIC_APP_ENV: e2e
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          NODE_ENV: production
        run: |
          cd apps/mobile/android
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --build-cache
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 3

  # Not `needs: build` (only `changed`, nightly): the shards start with it and wait for its APK
  # only after the emulator has booted (scripts/e2e/run-on-emulator.sh), so the setup and boot run
  # while Gradle builds. The shard files and their order are checked in scripts/e2e/shards.test.ts.
  e2e:
    needs: changed
    if: >-
      needs.changed.outputs.run != 'false' && !cancelled() &&
      (github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' &&
       (github.event.label.name == 'e2e' || github.event.label.name == 'e2e-large')) ||
      (github.event.action != 'labeled' &&
       (contains(github.event.pull_request.labels.*.name, 'e2e') ||
        contains(github.event.pull_request.labels.*.name, 'e2e-large'))))
    runs-on: ubuntu-24.04
    # A shard's own run takes ~16 minutes, a retry (below) as long again; at the largest text size
    # the flows are slower (large-1's took 23.7 min), so a late crash and its retry need ~48.
    timeout-minutes: ${{ matrix.font == '1.3' && 70 || 55 }}
    # actions: read for this run's e2e-apk artifact (run-on-emulator.sh).
    permissions:
      actions: read
      contents: read
    # Diagnostic (WazzupDevs/Kabuk#206, not to be merged): the gallery's 320 press on an S23's
    # screen at Android 14, 15 and 16, the default and the largest text size.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scheme: light, shard: 1, font: '1', api: 34 }
          - { scheme: light, shard: 1, font: '1.3', api: 34 }
          - { scheme: light, shard: 1, font: '1', api: 35 }
          - { scheme: light, shard: 1, font: '1', api: 36 }
          - { scheme: light, shard: 1, font: '1.3', api: 36 }
    env:
      SCHEME: ${{ matrix.scheme }}
      FONT_SCALE: ${{ matrix.font }}
      FLOW: e2e/maestro/diag-wide.yaml
      OUT: ${{ github.workspace }}/e2e-out/diag-api${{ matrix.api }}-font${{ matrix.font == '1' && '1' || '13' }}
      APK: ${{ github.workspace }}/apk/app-release.apk
    steps:
      - uses: actions/checkout@v4
      # The runner's free disk varies; the emulator's userdata partition needs ~7.5 GB next to the
      # local Supabase images. Tools this job never uses go first (the APK is built in `build`, so
      # the NDK too).
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk
          df -h /
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Local Supabase
        run: |
          mkdir -p "$OUT"
          cp supabase/.env.example supabase/.env
          pnpm supabase start -x studio,imgproxy,mailpit,logflare,vector,supavisor,postgres-meta,edge-runtime
          pnpm --filter scripts apply-local-secrets
          key=$(pnpm -s supabase status -o env | sed -n 's/^PUBLISHABLE_KEY="\(.*\)"$/\1/p')
          test "$key" = "$E2E_PUBLISHABLE_KEY" || { echo "local publishable key changed: $key"; exit 1; }
      # The local stack signs photo URLs on its internal address (http://kong:8000), which the
      # emulator cannot reach; LOCAL_DEVICE_URL puts the emulator's address in its place
      # (supabase/functions/_shared/pure/devProject.ts → deviceReachableUrl; local stack only).
      # The serve runs through both attempts of the shard and is started again when it stops on its
      # own, at most twice in the job; a third stop fails the job ("Functions serve exits" below).
      # On 19 Oct its container died in #168's light-2 ("error running container: exit 135") while
      # it served the app's account call. `supabase start` runs no edge runtime (-x edge-runtime
      # above): the serve's container is the only one, and the readiness check waits for it
      # (docs/decisions/ci-functions-serve.md → Hazırlık).
      - name: Edge Functions, E2E venue, bot table
        env:
          SERVE_STATE: ${{ env.OUT }}/serve-state
        run: |
          echo "LOCAL_DEVICE_URL=$E2E_SUPABASE_URL" > "$RUNNER_TEMP/functions.env"
          nohup bash scripts/ci/functions-serve.sh e2e "$OUT/functions.log" --env-file "$RUNNER_TEMP/functions.env" > /dev/null 2>&1 &
          bash scripts/ci/wait-for-serve.sh e2e "$OUT/functions.log" "$E2E_PUBLISHABLE_KEY"
          bash scripts/e2e/start-bots.sh
          node -e 'const s = require(process.argv[1]);
            console.log(`INSIDE_LAT=${s.inside.lat}\nINSIDE_LNG=${s.inside.lng}\nOUTSIDE_LAT=${s.outside.lat}\nOUTSIDE_LNG=${s.outside.lng}`)' \
            "$OUT/setup.json" >> "$GITHUB_ENV"
      - name: Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | MAESTRO_VERSION=2.10.0 bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version | tee "$OUT/maestro-version.txt"
      # The emulator and its system image come from the Actions cache instead of Google's servers on
      # every job: on 16 Oct two runs (#121, #123) died while sdkmanager downloaded the emulator
      # package ("Error on ZipFile unknown archive"), before any flow ran. The runner action still
      # updates the emulator when a newer one is out, and the cache is renewed every week. Only these
      # two SDK folders are cached; the AVD and the phone's data (app, settings, font size) live in
      # ~/.android and start fresh in every job. As with Gradle, only main's runs (nightly, manual)
      # write it and PR runs read it: a PR's copy is visible to that PR alone, and ~1.8 GB per PR
      # would push the Gradle cache out of the repo's 10 GB.
      - name: Week (emulator cache key)
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Emulator and system image cache
        id: emulator-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-${{ matrix.api }}/google_apis/x86_64
          key: android-emulator-${{ matrix.api }}-google_apis-x86_64-${{ steps.week.outputs.week }}
          restore-keys: android-emulator-${{ matrix.api }}-google_apis-x86_64-
      # Without this week's cache (before main's first run of the week, or a new emulator) the two
      # packages are downloaded here, with retries (scripts/e2e/sdk-install.sh): the failure ("Error
      # on ZipFile unknown archive", the emulator on #121 and #123, the system image on #126's first
      # run) passes on a second try. The runner action then finds them installed.
      - name: Emulator and system image download (with retries)
        if: steps.emulator-cache.outputs.cache-hit != 'true'
        run: bash scripts/e2e/sdk-install.sh emulator 'system-images;android-${{ matrix.api }};google_apis;x86_64'
      # One job of main's run saves it, before the emulator starts: only the downloaded packages.
      - name: Emulator and system image cache (save, main only)
        if: >-
          github.ref == 'refs/heads/main' && steps.emulator-cache.outputs.cache-hit != 'true' &&
          matrix.scheme == 'light' && matrix.shard == 1 && matrix.font == '1'
        uses: actions/cache/save@v4
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-${{ matrix.api }}/google_apis/x86_64
          key: ${{ steps.emulator-cache.outputs.cache-primary-key }}
      # Its failure does not end the job at once: the steps below decide on one retry, and "Result"
      # fails the job unless the retry passed.
      - name: Emulator, APK and the shard's flows
        id: flows
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/e2e/run-on-emulator.sh
      # One retry per shard, only when the test environment fell over: Maestro's driver on the phone
      # crashed while the flows ran, or could not be reached (scripts/e2e/retry.ts; #151's dark-1
      # and dark-4), or the Edge Functions server stopped during the failed step or at most 30 s
      # before it started (#168's light-2). A failing step without that (an assertion, "Element not
      # found") is never run again: it may be a real failure that comes and goes (#161's check-in
      # race). Nor after the server's third stop: it is not started again.
      - name: Test environment crash? (one retry)
        id: retry
        if: steps.flows.outcome == 'failure'
        env:
          JOB: e2e (${{ matrix.scheme }}, ${{ matrix.shard }}, ${{ matrix.font }})
        run: |
          reason=$(node --experimental-strip-types scripts/e2e/retry-check.ts "$OUT")
          if [ -z "$reason" ]; then
            echo "No retry (scripts/e2e/retry.ts): no test-environment crash while the flows ran, or functions serve gave up."
            exit 0
          fi
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          { echo "### $JOB: yeniden deneme"; echo; echo "- Sebep: $reason"; } | tee -a "$GITHUB_STEP_SUMMARY"
      # Before the retry: the first attempt's outputs into attempt-1/ (the artifact and the
      # screenshots branch keep them, except its takeScreenshot images), the local database back to
      # its start (test accounts, rooms, and the venues 02-checkin closed), and the bots anew. The
      # runner action then boots a new phone: it creates the AVD again.
      - name: Before the retry (outputs, local database, bots)
        if: steps.retry.outputs.reason != ''
        env:
          SERVE_STATE: ${{ env.OUT }}/serve-state
        run: |
          xargs kill < "$OUT/bots.pid" || true
          mkdir -p "$OUT/attempt-1"
          for f in screenshots maestro report.xml logcat.txt video.webm maestro-console.txt setup.json bot.log bot2.log bots.pid; do
            if [ -e "$OUT/$f" ]; then mv "$OUT/$f" "$OUT/attempt-1/"; fi
          done
          if [ -f "$OUT/attempt-1/logcat.txt" ]; then
            tail -n 3000 "$OUT/attempt-1/logcat.txt" > "$OUT/attempt-1/logcat-tail.txt"
          fi
          pnpm db:reset
          # A serve that stopped in the first attempt has been started again; the bots sign in
          # through it.
          bash scripts/ci/wait-for-serve.sh e2e "$OUT/functions.log" "$E2E_PUBLISHABLE_KEY"
          bash scripts/e2e/start-bots.sh
      - name: Emulator, APK and the shard's flows (retry)
        id: flows-retry
        if: steps.retry.outputs.reason != ''
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/e2e/run-on-emulator.sh
      # always(): also after a failed step on the retry's way (its reset), so the summary still says
      # how the retry ended.
      - name: Result
        if: always() && steps.flows.outcome == 'failure'
        env:
          RETRIED: ${{ steps.retry.outputs.reason != '' }}
          SECOND: ${{ steps.flows-retry.outcome }}
        run: |
          if [ "$RETRIED" != true ]; then
            echo "The shard's flows failed (no retry)."
            exit 1
          fi
          if [ "$SECOND" = success ]; then
            echo "- 2. deneme geçti." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "- 2. deneme de düştü ($SECOND). İlk deneme \`attempt-1/\` klasöründe." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      # Every time the serve stopped on its own (scripts/ci/functions-serve.sh), with its time, in
      # the job summary and as a warning on the run (the same warning as ci.yml's, read through the
      # API to count them over a week); the machine's state at each stop is in this job's artifact,
      # serve-state/crash-<n>.txt. A third stop fails the job here, whatever the flows did.
      - name: Functions serve exits
        if: always()
        env:
          SERVE_STATE: ${{ env.OUT }}/serve-state
          JOB: e2e (${{ matrix.scheme }}, ${{ matrix.shard }}, ${{ matrix.font }})
        run: |
          mkdir -p "$SERVE_STATE"
          touch "$SERVE_STATE/restarts.log"
          exits=$(wc -l < "$SERVE_STATE/restarts.log")
          if [ "$exits" -eq 0 ]; then exit 0; fi
          {
            echo "### $JOB: functions serve stopped on its own: $exits (started again at most twice)"
            echo
            echo "| Time (UTC) | Exit | Then |"
            echo "| --- | --- | --- |"
            awk -F'\t' '{ print "| " $1 " | `" $3 "` | " $4 " |" }' "$SERVE_STATE/restarts.log"
            echo
            echo "The machine at each stop (disk, /dev/shm, memory, docker stats): this job's artifact, serve-state/crash-<n>.txt."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r at name why then; do
            echo "::warning title=functions serve exited::$at UTC, $name serve: $why; $then"
          done < "$SERVE_STATE/restarts.log"
          if grep -q 'gave-up$' "$SERVE_STATE/restarts.log"; then
            echo "functions serve stopped a third time: the job fails."
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-run-diag-api${{ matrix.api }}-font${{ matrix.font == '1' && '1' || '13' }}
          path: ${{ env.OUT }}
          retention-days: 14

  # The visual gate (CLAUDE.md → Görsel kapı): the states of e2e/visual/states.json (the design
  # gallery's sets, game phases) opened in the app's hidden route with a fixed state (timers
  # frozen, motion off, randomness seeded) and photographed in light and dark on a phone at v46's
  # width and density (360 dp at 2x: skin 720x1280, density 320). Two comparisons: with the app's
  # own baselines (e2e/visual/baz/, Maestro assertScreenshot), the hard gate that fails the job;
  # and with v46's prototype rendered by Playwright at the same size and fonts, the soft similarity
  # report in the job summary with the diff images (the CTO decides). With the e2e label, as the
  # eight shards (not when only e2e-large has just been added), nightly and by hand. No local
  # stack: the route opens without signing in and reads nothing from the server. It starts with the
  # build job and boots its emulator while Gradle builds, as the shards do. TEKRAR photographs every
  # shot twice: the noise the hard threshold is set above (the summary's "Gürültü" table).
  visual:
    needs: changed
    # Diagnostic (WazzupDevs/Kabuk#206): off.
    if: >-
      false && needs.changed.outputs.run != 'false' && !cancelled() &&
      (github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'e2e') ||
      (github.event.action != 'labeled' &&
       (contains(github.event.pull_request.labels.*.name, 'e2e') ||
        contains(github.event.pull_request.labels.*.name, 'e2e-large'))))
    runs-on: ubuntu-24.04
    # The build (~8 min) and the shots (each state opened in the running app, scripts/visual/flow.ts)
    # well inside it; aim: no longer than the E2E shards (~25 min).
    timeout-minutes: 40
    # actions: read for this run's e2e-apk artifact (scripts/e2e/fetch-apk.sh).
    permissions:
      actions: read
      contents: read
    env:
      OUT: ${{ github.workspace }}/e2e-out/visual
      APK: ${{ github.workspace }}/apk/app-release.apk
      # Every shot photographed twice, nightly only: the noise table the threshold is checked
      # against (#184's first measurement: 23 of 24 at 100%, one at 99.92%).
      TEKRAR: ${{ github.event_name == 'schedule' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk
          df -h /
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Playwright's headless Chromium at the version in scripts/package.json, from the Actions cache
      # (written by main's runs, read by the rest, as the emulator's); v46's fonts are the app's own
      # files (scripts/visual/prototype.ts), not Google's.
      - name: Playwright version (cache key)
        id: playwright
        run: echo "version=$(node -p "require('./scripts/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ steps.playwright.outputs.version }}
      - name: Playwright Chromium download
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter scripts exec playwright install chromium --only-shell
      - name: Playwright Chromium cache (save, main only)
        if: github.ref == 'refs/heads/main' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - name: Design prototype (Playwright)
        run: |
          mkdir -p "$OUT"
          node --experimental-strip-types scripts/visual/render-prototype.ts . "$OUT"
      - name: Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | MAESTRO_VERSION=2.10.0 bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version | tee "$OUT/maestro-version.txt"
      # The emulator cache of the e2e job (read only; its light-1 job on main saves it).
      - name: Week (emulator cache key)
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Emulator and system image cache
        id: emulator-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
          key: android-emulator-34-google_apis-x86_64-${{ steps.week.outputs.week }}
          restore-keys: android-emulator-34-google_apis-x86_64-
      - name: Emulator and system image download (with retries)
        if: steps.emulator-cache.outputs.cache-hit != 'true'
        run: bash scripts/e2e/sdk-install.sh emulator 'system-images;android-34;google_apis;x86_64'
      # Its failure does not end the job at once: the report below still says which shots failed.
      - name: Emulator, APK and the gate's shots
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 720x1280
          disable-animations: true
          script: bash scripts/visual/run-on-emulator.sh
      # The images point at this run's screenshots branch (publish-screenshots, below) and the
      # baselines at the commit under test.
      - name: Report
        if: always()
        env:
          GORSEL_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event_name == 'pull_request' && format('e2e-screenshots-pr-{0}', github.event.pull_request.number) || 'e2e-screenshots' }}/visual
          GORSEL_BAZ_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/e2e/visual/baz
        run: node --experimental-strip-types scripts/visual/report.ts . "$OUT" | tee -a "$GITHUB_STEP_SUMMARY"
      # The hard gate: every shot photographed, every expected baseline there, every comparison
      # with a baseline passed (scripts/visual/report.ts → kapi.json).
      - name: Result
        if: always()
        run: |
          test -f "$OUT/kapi.json" || { echo "no gate report"; exit 1; }
          node -e 'const k = require(process.argv[1]); if (!k.ok) { console.log(JSON.stringify(k, null, 1)); process.exit(1); }' "$OUT/kapi.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-run-visual
          path: ${{ env.OUT }}
          retention-days: 14

  # Screenshots and logs (no video) on an e2e-screenshots branch, for readers without access to
  # artifact storage: an orphan branch with a single commit, force-pushed by every run, so binaries
  # never pile up in history. A PR run writes its own branch (e2e-screenshots-pr-<number>), so runs of
  # two PRs do not overwrite each other; main, nightly and manual runs write e2e-screenshots. (Git
  # cannot hold both e2e-screenshots and e2e-screenshots/pr-<number>, hence the dash.) Each shard's
  # run is in its own folder (light-1 … dark-4, and large-1 … large-4 at the largest text size);
  # light/takeScreenshot and dark/takeScreenshot hold the takeScreenshot images of the scheme's four
  # shards together, for `pnpm store:screenshots` (large/takeScreenshot those of the large pass); a
  # retried shard's first attempt is in its folder's attempt-1/, without those images. A PR run that
  # only the e2e-large label started writes the four large folders alone. The visual gate's run is
  # in visual/ (its candidates in visual/aday/, which `pnpm visual:accept` reads).
  publish-screenshots:
    if: ${{ always() && (needs.e2e.result != 'skipped' || needs.visual.result != 'skipped') }}
    needs: [e2e, visual]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-run-*
          path: out
      - name: Push to e2e-screenshots
        env:
          BRANCH: ${{ github.event_name == 'pull_request' && format('e2e-screenshots-pr-{0}', github.event.pull_request.number) || 'e2e-screenshots' }}
        run: |
          mkdir site
          for dir in out/*; do
            run=${dir#out/e2e-run-}
            mkdir -p "site/$run"
            (cd "$dir" && find . -type f ! -name '*.webm' ! -name 'logcat.txt' -exec cp --parents {} "../../site/$run/" \;)
            tail -n 3000 "$dir/logcat.txt" > "site/$run/logcat-tail.txt" 2>/dev/null || true
            if [ "$run" = visual ]; then continue; fi
            mkdir -p "site/${run%-*}/takeScreenshot"
            find "$dir" -path '*/takeScreenshot/*.png' ! -path '*/attempt-1/*' -exec cp {} "site/${run%-*}/takeScreenshot/" \;
          done
          cd site
          git init -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q --allow-empty -m "E2E screenshots, run ${{ github.run_id }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$BRANCH"
