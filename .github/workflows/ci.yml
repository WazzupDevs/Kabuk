# Basic checks on every PR and on main. Branch protection requires the single job named "ci",
# which passes only when both "checks" and "integration" pass (CLAUDE.md → "CI ve main").
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # typecheck (mobile, scripts, pure/, Edge Functions with deno check, root), lint, format, unit
  # tests, and the legal site build when the repo has it.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # pull-requests: read for the PR's files and labels (the visual gate's baselines, below).
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The visual gate's baselines (e2e/visual/baz/) change only after the CTO has approved the
      # new images: a PR that adds, changes or removes one needs the `gorsel-baz` label (CLAUDE.md
      # → Görsel kapı). The label is read when the job runs: put on before the push that brings the
      # baselines, it counts; put on later, the job is run again.
      - name: Visual gate baselines need the gorsel-baz label
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          changed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | select((.filename | startswith("e2e/visual/baz/")) or ((.previous_filename // "") | startswith("e2e/visual/baz/"))) | .filename')
          if [ -z "$changed" ]; then
            echo "No baseline changed."
            exit 0
          fi
          echo "Baselines changed:"
          echo "$changed"
          if gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.labels[].name' | grep -qx gorsel-baz; then
            echo "gorsel-baz label on: the CTO approved them."
            exit 0
          fi
          echo "::error title=Visual gate baselines::This PR changes e2e/visual/baz/ without the gorsel-baz label (CLAUDE.md → Görsel kapı): baselines change only after the CTO has approved the new images."
          exit 1
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # deno check downloads the Edge Functions' npm: imports; keyed on the lock file.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock', 'supabase/functions/_shared/deps.ts') }}
          restore-keys: deno-${{ runner.os }}-
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm run --if-present site:build

  # Integration tests against the local stack, the same commands as on a developer machine
  # (CLAUDE.md → pnpm test:integration). globalSetup pauses pg_cron for the run.
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # supabase/tests/local.ts writes here every call the local serve refused or cut off (refusal.ts),
      # and whether it sent the call again.
      INVOKE_RETRY_LOG: invoke-retries.log
      # scripts/ci/functions-serve.sh: the serve's exits (restarts.log) and the machine's state at
      # each one (crash-<n>.txt).
      SERVE_STATE: serve-state
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No edge runtime from `supabase start` (-x edge-runtime): the serve's container is the only
      # one, and the readiness check waits for it (docs/decisions/ci-functions-serve.md → Hazırlık).
      - name: Local Supabase
        run: |
          cp supabase/.env.example supabase/.env
          pnpm supabase start -x studio,mailpit,logflare,vector,supavisor,postgres-meta,edge-runtime
          pnpm db:reset
      # The serve is started again when it exits on its own, at most twice in the job; a third exit
      # fails the job (scripts/ci/functions-serve.sh, "Functions serve exits" below).
      - name: Edge Functions
        run: |
          nohup bash scripts/ci/functions-serve.sh main functions.log > /dev/null 2>&1 &
          key=$(pnpm -s supabase status -o env | sed -n 's/^PUBLISHABLE_KEY="\(.*\)"$/\1/p')
          bash scripts/ci/wait-for-serve.sh main functions.log "$key"
      - run: pnpm test:integration
      # CHECKIN_SKIP_LOCATION (dev project only) needs a function server started with the secret:
      # restart serve with it and run only its test (supabase/tests/checkinSkipLocation.test.ts).
      # main.stop first: this stop is deliberate, the first serve is not started again.
      - name: Check-in with CHECKIN_SKIP_LOCATION=1
        run: |
          touch "$SERVE_STATE/main.stop"
          pkill -f "supabase functions serve" || true
          until ! pgrep -f "supabase functions serve" > /dev/null; do sleep 1; done
          while kill -0 "$(cat "$SERVE_STATE/main.pid")" 2> /dev/null; do sleep 1; done
          echo CHECKIN_SKIP_LOCATION=1 > "$RUNNER_TEMP/skip.env"
          nohup bash scripts/ci/functions-serve.sh skip functions-skip.log --env-file "$RUNNER_TEMP/skip.env" > /dev/null 2>&1 &
          key=$(pnpm -s supabase status -o env | sed -n 's/^PUBLISHABLE_KEY="\(.*\)"$/\1/p')
          bash scripts/ci/wait-for-serve.sh skip functions-skip.log "$key"
          CHECKIN_SKIP_LOCATION_TEST=1 pnpm vitest run -c vitest.integration.config.ts supabase/tests/checkinSkipLocation.test.ts
      # The calls the local serve refused and the tests sent again (supabase/tests/refusal.ts), in
      # the job summary: the total, and per call and refusal. A call that comes back often is looked
      # at separately.
      - name: Retries
        if: always()
        run: |
          touch invoke-retries.log
          total=$(wc -l < invoke-retries.log)
          again=$(grep -c ' yes$' invoke-retries.log || true)
          {
            echo "### Edge Function calls refused or cut off by the local serve: $total, sent again: $again"
            if [ "$total" -gt 0 ]; then
              echo
              echo "| Times | Call | Answer | Sent again |"
              echo "| ---: | --- | --- | --- |"
              sort invoke-retries.log | uniq -c | sort -rn | awk '{ print "| " $1 " | `" $2 "` | " $3 " | " $4 " |" }'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # A call that found the serve's runtime gone (Kong's 503 "name resolution failed") also as
          # a warning on the run: vitest does not print a passing test's console warnings.
          grep ' no-runtime ' invoke-retries.log | while read -r call fault again; do
            echo "::warning title=Edge Function call found no runtime::$call: Kong 503 \"name resolution failed\" ($fault), sent again after ping: $again"
          done || true
      # Every time the serve exited on its own (scripts/ci/functions-serve.sh), with its time, in the
      # job summary and as a warning on the run (readable through the API, for counting them over a
      # week). A third exit fails the job here too, whatever the tests did.
      - name: Functions serve exits
        if: always()
        run: |
          mkdir -p "$SERVE_STATE"
          touch "$SERVE_STATE/restarts.log"
          exits=$(wc -l < "$SERVE_STATE/restarts.log")
          {
            echo "### functions serve exited on its own: $exits (started again at most twice)"
            if [ "$exits" -gt 0 ]; then
              echo
              echo "| Time (UTC) | Serve | Exit | Then |"
              echo "| --- | --- | --- | --- |"
              awk -F'\t' '{ print "| " $1 " | " $2 " | `" $3 "` | " $4 " |" }' "$SERVE_STATE/restarts.log"
              echo
              echo "The machine at each exit (disk, /dev/shm, memory, docker stats): functions-logs artifact, serve-state/crash-<n>.txt."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r at name why then; do
            echo "::warning title=functions serve exited::$at UTC, $name serve: $why; $then"
          done < "$SERVE_STATE/restarts.log"
          if grep -q 'gave-up$' "$SERVE_STATE/restarts.log"; then
            echo "functions serve exited a third time: the job fails."
            exit 1
          fi
      - if: failure()
        run: tail -n 200 functions.log functions-skip.log 2>/dev/null || true
      # The whole serve log, to match a failure against the runtime's lines (a retired isolate, a
      # refused request) beyond the tail above; also after any exit of the serve, with the machine's
      # state at that moment, so a restart that saved the run still shows why it was needed.
      - if: failure() || hashFiles('serve-state/crash-*.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: functions-logs
          path: |
            functions.log
            functions-skip.log
            serve-state/
          if-no-files-found: ignore
          retention-days: 14

  # The one required status check.
  ci:
    if: always()
    needs: [checks, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: checks and integration passed
        run: |
          echo "checks: ${{ needs.checks.result }}, integration: ${{ needs.integration.result }}"
          test "${{ needs.checks.result }}" = success
          test "${{ needs.integration.result }}" = success
