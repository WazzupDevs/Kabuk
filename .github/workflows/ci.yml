# Basic checks on every PR and on main. Branch protection requires the single job named "ci",
# which passes only when both "checks" and "integration" pass (CLAUDE.md → "CI ve main").
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # typecheck (mobile, scripts, pure/, Edge Functions with deno check, root), lint, format, unit
  # tests, and the legal site build when the repo has it.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # deno check downloads the Edge Functions' npm: imports; keyed on the lock file.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock', 'supabase/functions/_shared/deps.ts') }}
          restore-keys: deno-${{ runner.os }}-
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm run --if-present site:build

  # Integration tests against the local stack, the same commands as on a developer machine
  # (CLAUDE.md → pnpm test:integration). globalSetup pauses pg_cron for the run.
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # supabase/tests/local.ts writes here every call the local serve refused and it sent again.
      INVOKE_RETRY_LOG: invoke-retries.log
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Local Supabase
        run: |
          cp supabase/.env.example supabase/.env
          pnpm supabase start -x studio,mailpit,logflare,vector,supavisor,postgres-meta
          pnpm db:reset
      - name: Edge Functions
        run: |
          nohup pnpm supabase functions serve > functions.log 2>&1 &
          key=$(pnpm -s supabase status -o env | sed -n 's/^PUBLISHABLE_KEY="\(.*\)"$/\1/p')
          timeout 180 bash -c "until curl -sf -X POST http://127.0.0.1:54321/functions/v1/ping -H 'apikey: $key' -H 'content-type: application/json' -d '{}' > /dev/null; do sleep 2; done"
      - run: pnpm test:integration
      # CHECKIN_SKIP_LOCATION (dev project only) needs a function server started with the secret:
      # restart serve with it and run only its test (supabase/tests/checkinSkipLocation.test.ts).
      - name: Check-in with CHECKIN_SKIP_LOCATION=1
        run: |
          pkill -f "supabase functions serve" || true
          until ! pgrep -f "supabase functions serve" > /dev/null; do sleep 1; done
          echo CHECKIN_SKIP_LOCATION=1 > "$RUNNER_TEMP/skip.env"
          nohup pnpm supabase functions serve --env-file "$RUNNER_TEMP/skip.env" > functions-skip.log 2>&1 &
          key=$(pnpm -s supabase status -o env | sed -n 's/^PUBLISHABLE_KEY="\(.*\)"$/\1/p')
          timeout 180 bash -c "until curl -sf -X POST http://127.0.0.1:54321/functions/v1/ping -H 'apikey: $key' -H 'content-type: application/json' -d '{}' > /dev/null; do sleep 2; done"
          CHECKIN_SKIP_LOCATION_TEST=1 pnpm vitest run -c vitest.integration.config.ts supabase/tests/checkinSkipLocation.test.ts
      # The calls the local serve refused and the tests sent again (supabase/tests/refusal.ts), in
      # the job summary: the total, and per call and refusal. A call that comes back often is looked
      # at separately.
      - name: Retries
        if: always()
        run: |
          touch invoke-retries.log
          total=$(wc -l < invoke-retries.log)
          {
            echo "### Edge Function calls sent again: $total"
            if [ "$total" -gt 0 ]; then
              echo
              echo "| Times | Call | Refusal |"
              echo "| ---: | --- | --- |"
              sort invoke-retries.log | uniq -c | sort -rn | awk '{ print "| " $1 " | `" $2 "` | " $3 " |" }'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - if: failure()
        run: tail -n 200 functions.log functions-skip.log 2>/dev/null || true
      # The whole serve log, to match a failure against the runtime's lines (a retired isolate, a
      # refused request) beyond the tail above.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: functions-logs
          path: |
            functions.log
            functions-skip.log
          if-no-files-found: ignore
          retention-days: 14

  # The one required status check.
  ci:
    if: always()
    needs: [checks, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: checks and integration passed
        run: |
          echo "checks: ${{ needs.checks.result }}, integration: ${{ needs.integration.result }}"
          test "${{ needs.checks.result }}" = success
          test "${{ needs.integration.result }}" = success
