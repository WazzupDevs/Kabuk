# TRIAL ONLY (claude/visual-trial, never merged): the RN 0.86 visual trial. One release APK (as
# e2e.yml builds it), then one job on a low-end emulator: v46's cards with RN's own gradients and
# inset shadows, scroll smoothness against the same list drawn flat, and 320 dp at font 1.3.
name: visual-trial

on:
  push:
    branches: [claude/visual-trial]
  workflow_dispatch:

concurrency:
  group: visual-trial
  cancel-in-progress: true

env:
  E2E_SUPABASE_URL: http://10.0.2.2:54321
  E2E_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: NDK (with retries)
        run: |
          ndk=$(sed -n 's/^ndkVersion = "\(.*\)"$/\1/p' node_modules/react-native/gradle/libs.versions.toml)
          bash scripts/e2e/sdk-install.sh "ndk;$ndk"
      - name: Prebuild, local-stack settings
        run: |
          (cd apps/mobile && npx expo prebuild --platform android --no-install --clean)
          bash scripts/e2e/patch-android.sh
      - name: Release APK, x86_64 only
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ env.E2E_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.E2E_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_APP_ENV: e2e
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          NODE_ENV: production
        run: |
          cd apps/mobile/android
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --build-cache
      - uses: actions/upload-artifact@v4
        with:
          name: trial-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 3

  scroll:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OUT: ${{ github.workspace }}/trial-out/scroll
      APK: ${{ github.workspace }}/apk/app-release.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: trial-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
          key: android-emulator-34-google_apis-x86_64-none
          restore-keys: android-emulator-34-google_apis-x86_64-
      # The low end: two cores, 3 GB (2 GB at 720 × 1280 took the emulator down in the first run),
      # the software GPU every CI emulator has.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          cores: 2
          ram-size: 3072M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 720x1280
          disable-animations: false
          script: bash scripts/trial/scroll.sh
      - name: Summary
        if: always()
        run: |
          node --experimental-strip-types scripts/trial/report.ts scroll "$OUT" | tee -a "$GITHUB_STEP_SUMMARY"
          node --experimental-strip-types scripts/trial/report.ts narrow "$OUT" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trial-scroll
          path: ${{ env.OUT }}
