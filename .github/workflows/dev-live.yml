# Live check of the venue chat's clientId (Grup 3, P5) against the hosted dev project
# (scripts/dev-live/venue-chat-client-id.ts): the same clientId gives the same messageId, one row and
# one broadcast; a send without a clientId (apps before P5) still works. Writes only test messages
# of one dev test account, deletes them and leaves the venue. Never the production project: the
# script refuses any URL but the dev project's.
#
# Runs when the `dev-canli` label is added to a PR (again: remove and add it) or by hand (Actions →
# dev-live → Run workflow). Reads three repository secrets, set once in GitHub → Settings → Secrets
# and variables → Actions: DEV_PUBLISHABLE_KEY (the dev project's publishable key), DEV_TEST_PHONE
# and DEV_TEST_OTP (a dev test number from the dashboard and its code; one no phone is using). They
# are never printed; the result is in the run's summary.
name: dev-live

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-live
  cancel-in-progress: false

jobs:
  venue-chat-client-id:
    if: github.event_name == 'workflow_dispatch' || (github.event.label.name == 'dev-canli' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Same clientId on the dev project
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEV_PUBLISHABLE_KEY }}
          TEST_PHONE: ${{ secrets.DEV_TEST_PHONE }}
          TEST_OTP: ${{ secrets.DEV_TEST_OTP }}
        run: node --experimental-strip-types scripts/dev-live/venue-chat-client-id.ts
