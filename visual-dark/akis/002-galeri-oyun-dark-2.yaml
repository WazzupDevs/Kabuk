appId: app.kabuk.mobile
name: galeri-oyun-dark-2
---
- openLink: "masa:///gorsel?durum=galeri/games&tema=dark&sayfa=1&sayfalar=5&n=2"
- extendedWaitUntil:
    notVisible:
      id: launch-curtain
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: gorsel-hazir-2
    timeout: 20000
    optional: true
- runFlow:
    when:
      notVisible:
        id: gorsel-hazir-2
    commands:
      - stopApp
      - openLink: "masa:///gorsel?durum=galeri/games&tema=dark&sayfa=1&sayfalar=5&n=2"
      - extendedWaitUntil:
          notVisible:
            id: launch-curtain
          timeout: 60000
      - extendedWaitUntil:
          visible:
            id: gorsel-hazir-2
          timeout: 60000
- assertNotVisible:
    id: gorsel-yok
- assertNotVisible:
    id: gorsel-eksik-sayfa
- runFlow:
    when:
      visible:
        id: android:id/aerr_wait
    commands:
      - tapOn:
          id: android:id/aerr_wait
- takeScreenshot:
    path: aday__galeri-oyun-dark-2
    cropOn:
      id: gorsel-cerceve
