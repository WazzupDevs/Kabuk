appId: app.kabuk.mobile
name: galeri-oyun-dark-5
---
- openLink: "masa:///gorsel?durum=galeri/games&tema=dark&sayfa=4&sayfalar=5&n=5"
- extendedWaitUntil:
    notVisible:
      id: launch-curtain
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: gorsel-hazir-5
    timeout: 20000
    optional: true
- runFlow:
    when:
      notVisible:
        id: gorsel-hazir-5
    commands:
      - stopApp
      - openLink: "masa:///gorsel?durum=galeri/games&tema=dark&sayfa=4&sayfalar=5&n=5"
      - extendedWaitUntil:
          notVisible:
            id: launch-curtain
          timeout: 60000
      - extendedWaitUntil:
          visible:
            id: gorsel-hazir-5
          timeout: 60000
- assertNotVisible:
    id: gorsel-yok
- assertNotVisible:
    id: gorsel-eksik-sayfa
- runFlow:
    when:
      visible:
        id: android:id/aerr_wait
    commands:
      - tapOn:
          id: android:id/aerr_wait
- takeScreenshot:
    path: aday__galeri-oyun-dark-5
    cropOn:
      id: gorsel-cerceve
