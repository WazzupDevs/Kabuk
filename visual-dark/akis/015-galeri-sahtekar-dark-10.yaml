appId: app.kabuk.mobile
name: galeri-sahtekar-dark-10
---
- openLink: "masa:///gorsel?durum=galeri/sahtekar&tema=dark&sayfa=9&sayfalar=10&n=15"
- extendedWaitUntil:
    notVisible:
      id: launch-curtain
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: gorsel-hazir-15
    timeout: 20000
    optional: true
- runFlow:
    when:
      notVisible:
        id: gorsel-hazir-15
    commands:
      - stopApp
      - openLink: "masa:///gorsel?durum=galeri/sahtekar&tema=dark&sayfa=9&sayfalar=10&n=15"
      - extendedWaitUntil:
          notVisible:
            id: launch-curtain
          timeout: 60000
      - extendedWaitUntil:
          visible:
            id: gorsel-hazir-15
          timeout: 60000
- assertNotVisible:
    id: gorsel-yok
- assertNotVisible:
    id: gorsel-eksik-sayfa
- runFlow:
    when:
      visible:
        id: android:id/aerr_wait
    commands:
      - tapOn:
          id: android:id/aerr_wait
- takeScreenshot:
    path: aday__galeri-sahtekar-dark-10
    cropOn:
      id: gorsel-cerceve
