appId: app.kabuk.mobile
name: galeri-ibre-dark-1
---
- openLink: "masa:///gorsel?durum=galeri/ibre&tema=dark&sayfa=0&sayfalar=3&n=19"
- extendedWaitUntil:
    notVisible:
      id: launch-curtain
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: gorsel-hazir-19
    timeout: 20000
    optional: true
- runFlow:
    when:
      notVisible:
        id: gorsel-hazir-19
    commands:
      - stopApp
      - openLink: "masa:///gorsel?durum=galeri/ibre&tema=dark&sayfa=0&sayfalar=3&n=19"
      - extendedWaitUntil:
          notVisible:
            id: launch-curtain
          timeout: 60000
      - extendedWaitUntil:
          visible:
            id: gorsel-hazir-19
          timeout: 60000
- assertNotVisible:
    id: gorsel-yok
- assertNotVisible:
    id: gorsel-eksik-sayfa
- runFlow:
    when:
      visible:
        id: android:id/aerr_wait
    commands:
      - tapOn:
          id: android:id/aerr_wait
- takeScreenshot:
    path: aday__galeri-ibre-dark-1
    cropOn:
      id: gorsel-cerceve
